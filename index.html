<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Music Player" />
  <title>Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --bg-elevated: #0d0d0d;
      --surface: #141414;
      --surface-hover: #1d1d1d;
      --surface-2: #262626;
      --border: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text: rgba(255, 255, 255, 0.92);
      --text-secondary: rgba(255, 255, 255, 0.66);
      --text-muted: rgba(255, 255, 255, 0.45);
      --primary: #e53935;
      --primary-light: #ff6f60;
      --primary-dark: #ab000d;
      --primary-muted: rgba(229, 57, 53, 0.16);
      --primary-hover: rgba(229, 57, 53, 0.1);
      --primary-border: rgba(255, 111, 96, 0.5);
      --e1: 0 2px 1px -1px rgba(0,0,0,.5), 0 1px 1px 0 rgba(0,0,0,.35), 0 1px 3px 0 rgba(0,0,0,.3);
      --e2: 0 3px 1px -2px rgba(0,0,0,.5), 0 2px 2px 0 rgba(0,0,0,.35), 0 1px 5px 0 rgba(0,0,0,.3);
      --e6: 0 3px 5px -1px rgba(0,0,0,.5), 0 6px 10px 0 rgba(0,0,0,.35), 0 1px 18px 0 rgba(0,0,0,.3);
      --e24: 0 11px 15px -7px rgba(0,0,0,.6), 0 24px 38px 3px rgba(0,0,0,.45), 0 9px 46px 8px rgba(0,0,0,.4);
      --radius: 4px;
      --font: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { background: var(--bg); }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .shell {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (min-width: 860px) {
      .shell {
        grid-template-columns: 340px 1fr;
        grid-template-rows: 1fr;
        height: 100vh;
        height: 100dvh;
        max-height: 100dvh;
      }
    }

    /* ---------- Painel do player ---------- */
    .player-panel {
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      padding: 20px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: var(--e2);
      position: relative;
      z-index: 1;
    }

    @media (min-width: 860px) {
      .player-panel {
        border-bottom: none;
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 24px;
      }
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .brand-icon {
      width: 40px; height: 40px;
      background: var(--primary);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--e2);
    }
    .brand-icon svg { width: 22px; height: 22px; fill: #fff; }

    .brand h1 { font-size: 1.25rem; font-weight: 500; letter-spacing: 0.0075em; line-height: 1.2; }
    .brand span { display: block; font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; letter-spacing: 0.03em; }

    .now-playing { text-align: center; padding: 4px 0 0; }

    .artwork {
      width: 168px; height: 168px;
      margin: 0 auto 20px;
      border-radius: 8px;
      background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      box-shadow: var(--e6);
    }
    .artwork svg { width: 56px; height: 56px; fill: var(--text-muted); opacity: .6; }
    .artwork img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; }
    .artwork.playing::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(229,57,53,.28) 0%, transparent 70%);
      animation: pulse 2.5s ease-in-out infinite; pointer-events: none;
    }
    @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }

    .track-label {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--primary-light); margin-bottom: 4px; font-weight: 500;
    }
    .track-title {
      font-size: 1.1rem; font-weight: 500; line-height: 1.35;
      word-break: break-word; padding: 0 4px;
    }
    .track-title.empty { color: var(--text-muted); font-weight: 400; font-size: .9rem; }
    .now-playing .btn { margin-top: 14px; }

    .progress-section { display: flex; flex-direction: column; gap: 6px; }
    .progress-track {
      height: 4px; background: rgba(255,255,255,.14);
      border-radius: 99px; cursor: pointer; position: relative; margin: 8px 0 4px;
    }
    .progress-track::before { content: ''; position: absolute; inset: -12px 0; }
    .progress-fill {
      height: 100%; width: 0%; background: var(--primary);
      border-radius: 99px; pointer-events: none; position: relative;
    }
    .progress-fill::after {
      content: ''; position: absolute; right: -6px; top: 50%;
      width: 12px; height: 12px; margin-top: -6px;
      background: var(--primary); border-radius: 50%; box-shadow: var(--e1);
    }
    .time-row {
      display: flex; justify-content: space-between;
      font-size: 0.75rem; color: var(--text-muted);
      font-variant-numeric: tabular-nums; letter-spacing: 0.03em;
    }

    .controls { display: flex; align-items: center; justify-content: center; gap: 14px; }

    .ctrl, .icon-btn {
      width: 48px; height: 48px; border: none; background: transparent;
      color: var(--text-secondary); border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, color .2s;
      position: relative; overflow: hidden; font-family: inherit;
    }
    .ctrl:hover, .icon-btn:hover { background: rgba(255,255,255,.08); color: var(--text); }
    .ctrl svg, .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }

    .ctrl-play {
      width: 64px; height: 64px; background: var(--primary); color: #fff; box-shadow: var(--e6);
    }
    .ctrl-play:hover { background: #f44336; color: #fff; box-shadow: var(--e24); }
    .ctrl-play svg { width: 30px; height: 30px; }

    .secondary-controls { display: flex; flex-direction: column; gap: 16px; }

    .volume-row { display: flex; align-items: center; gap: 14px; padding: 2px 2px; }
    .volume-row svg { width: 22px; height: 22px; fill: var(--text-muted); flex-shrink: 0; }
    .volume-row input[type="range"] {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 4px; background: rgba(255,255,255,.18); border-radius: 99px; outline: none;
    }
    .volume-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: var(--primary); cursor: pointer; border: none; box-shadow: var(--e1);
    }
    .volume-row input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; border: none;
    }

    .mode-group { display: grid; grid-template-columns: 1fr 1fr; }
    .mode-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 9px 12px; border: 1px solid var(--border); background: transparent;
      color: var(--text-secondary); font-size: .8125rem; font-weight: 500; font-family: inherit;
      text-transform: uppercase; letter-spacing: .04em;
      cursor: pointer; transition: background .2s, color .2s; position: relative; overflow: hidden;
    }
    .mode-btn:first-child { border-radius: 4px 0 0 4px; }
    .mode-btn:last-child { border-radius: 0 4px 4px 0; border-left: none; }
    .mode-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .mode-btn.active { background: var(--primary-muted); color: var(--primary-light); border-color: var(--primary-border); }
    .mode-btn.active:last-child { border-left: 1px solid var(--primary-border); }
    .mode-btn:hover:not(.active) { background: rgba(255,255,255,.06); }

    /* ---------- Painel principal ---------- */
    .main-panel { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }

    .main-header {
      padding: 16px 20px 12px; border-bottom: 1px solid var(--border-subtle);
      display: flex; flex-direction: column; gap: 14px; flex-shrink: 0;
    }
    .main-header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .main-header h2 { font-size: 1.25rem; font-weight: 500; letter-spacing: .0075em; }
    .track-count { font-size: .8125rem; color: var(--text-muted); font-weight: 400; margin-left: 8px; }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* Botões estilo MUI */
    .btn, .m-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 6px 16px; min-height: 36px;
      border: 1px solid transparent; background: transparent;
      color: var(--primary-light);
      font-size: .8125rem; font-weight: 500; font-family: inherit;
      text-transform: uppercase; letter-spacing: .04em; line-height: 1.75;
      border-radius: var(--radius); cursor: pointer;
      transition: background .2s, box-shadow .2s, border-color .2s;
      white-space: nowrap; position: relative; overflow: hidden;
    }
    .btn svg { width: 18px; height: 18px; fill: currentColor; }
    .btn:hover, .m-btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: .4; cursor: default; }

    .btn-contained, .m-btn.contained { background: var(--primary); color: #fff; box-shadow: var(--e2); }
    .btn-contained:hover, .m-btn.contained:hover { background: #f44336; box-shadow: var(--e6); }
    .btn-outlined { border-color: var(--primary-border); }
    .btn-outlined.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-outlined.active:hover { background: #f44336; }

    .delete-banner {
      display: flex; align-items: center; gap: 10px;
      background: var(--primary-muted); border: 1px solid var(--primary-border);
      color: var(--primary-light); border-radius: var(--radius);
      padding: 10px 14px; font-size: .875rem;
    }
    .delete-banner[hidden] { display: none; }
    .delete-banner svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

    .sort-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sort-label { font-size: .75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 500; }
    .sort-btn {
      padding: 4px 12px; min-height: 32px; border: 1px solid var(--border); background: transparent;
      color: var(--text-secondary); font-size: .8125rem; font-weight: 400; font-family: inherit;
      border-radius: 16px; cursor: pointer; transition: background .2s, color .2s;
      display: inline-flex; align-items: center; gap: 6px; position: relative; overflow: hidden;
    }
    .sort-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .sort-btn:hover { background: rgba(255,255,255,.06); }
    .sort-btn.active { color: #fff; background: var(--primary); border-color: var(--primary); }

    .playlist-wrap { flex: 1; overflow-y: auto; min-height: 0; padding: 12px 16px 16px; }
    .playlist { list-style: none; }

    .playlist-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 48px 24px; color: var(--text-muted); text-align: center;
    }
    .playlist-empty svg { width: 48px; height: 48px; fill: var(--text-muted); opacity: .5; }
    .playlist-empty p { font-size: .9rem; }

    .track {
      display: grid; grid-template-columns: 24px 44px 1fr auto 36px 36px;
      align-items: center; gap: 4px 10px; padding: 8px 8px 8px 10px;
      border-radius: var(--radius); cursor: pointer;
      transition: background .15s, box-shadow .15s;
      user-select: none; margin-bottom: 8px; background: var(--surface);
      box-shadow: var(--e1);
    }
    .track:hover { background: var(--surface-hover); }
    .track.playing { background: var(--primary-muted); box-shadow: var(--e1), inset 3px 0 0 var(--primary); }
    .track.playing .t-name { color: var(--primary-light); font-weight: 500; }
    .track.dragging { opacity: .4; }
    .track.drag-over { box-shadow: inset 0 2px 0 0 var(--primary); }

    .delete-mode .track { box-shadow: var(--e1), inset 0 0 0 1px rgba(229,57,53,.45); }
    .delete-mode .track:hover { background: var(--primary-muted); box-shadow: var(--e2), inset 0 0 0 1px var(--primary); }

    .t-cover {
      width: 44px; height: 44px; border-radius: 4px; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;
    }
    .t-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .t-cover svg { width: 20px; height: 20px; fill: var(--text-muted); opacity: .6; }

    .t-handle {
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); cursor: grab; opacity: 0; transition: opacity .15s;
    }
    .track:hover .t-handle { opacity: 1; }
    .t-handle svg { width: 16px; height: 16px; fill: currentColor; }
    .delete-mode .t-handle { visibility: hidden; }

    .t-info { min-width: 0; overflow: hidden; }
    .t-name { font-size: .9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-meta { font-size: .75rem; color: var(--text-muted); margin-top: 1px; }
    .t-duration { font-size: .8125rem; color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 36px; text-align: right; }

    .t-remove, .t-lyrics {
      width: 36px; height: 36px; border: none; background: transparent; color: var(--text-muted);
      border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .2s, color .2s; position: relative; overflow: hidden;
    }
    .t-remove svg, .t-lyrics svg { width: 20px; height: 20px; fill: currentColor; }
    .t-lyrics:hover { background: rgba(255,255,255,.1); color: var(--text); }
    .t-remove:hover { background: var(--primary-muted); color: var(--primary-light); }

    @media (hover: none) {
      .t-handle { display: none; }
    }

    input[type="file"] { display: none; }

    .storage-status { font-size: .75rem; color: var(--text-muted); padding: 0 20px 12px; text-align: right; flex-shrink: 0; }

    /* ---------- Toast (Snackbar) ---------- */
    .toast {
      position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #323232; color: #fff; padding: 12px 20px; border-radius: var(--radius);
      font-size: .875rem; box-shadow: var(--e6); opacity: 0;
      transition: all .3s cubic-bezier(.16,1,.3,1); z-index: 400; max-width: 90vw; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.warn { border-left: 4px solid var(--primary); }

    /* ---------- Dialogs (Modal) ---------- */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.75);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 300;
    }
    .modal-backdrop[hidden] { display: none; }
    #confirmModal { z-index: 350; }

    .dialog {
      background: #1e1e1e; border-radius: 4px; box-shadow: var(--e24);
      width: 100%; max-width: 420px; padding: 24px 24px 12px;
      animation: dialogIn .2s ease-out;
    }
    @keyframes dialogIn { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .dialog h3 { font-size: 1.15rem; font-weight: 500; line-height: 1.4; word-break: break-word; margin-bottom: 8px; }
    .dialog p { color: var(--text-secondary); font-size: .9rem; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 0 4px; }
    .dialog-actions .m-btn.text { margin-right: auto; }
    #confirmModal .dialog-actions .m-btn.text { margin-right: 0; }

    .dialog-lg {
      max-width: 640px; max-height: calc(100dvh - 32px);
      display: flex; flex-direction: column; padding: 16px 20px 12px;
    }
    .dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .dialog-header h3 { margin: 0; }
    .lyrics-search { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .lyrics-search input {
      flex: 1 1 140px; min-width: 0; background: transparent; color: var(--text);
      border: 1px solid rgba(255,255,255,.23); border-radius: var(--radius);
      padding: 8px 12px; font-size: .9rem; font-family: inherit; outline: none;
    }
    .lyrics-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    .lyrics-body { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); padding: 14px 2px; }
    .lyrics-text { white-space: pre-wrap; line-height: 1.7; font-size: 1rem; word-break: break-word; }
    .lyrics-text.muted { color: var(--text-muted); font-size: .9rem; }
    .lyrics-body textarea {
      width: 100%; min-height: 280px; resize: vertical; background: transparent; color: var(--text);
      border: 1px solid rgba(255,255,255,.23); border-radius: var(--radius); padding: 10px 12px;
      font-family: inherit; font-size: 1rem; line-height: 1.6; outline: none;
    }
    .lyrics-body textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    .lyrics-body textarea[hidden] { display: none; }

    /* ---------- Ripple ---------- */
    .ripple-span {
      position: absolute; border-radius: 50%; background: rgba(255,255,255,.28);
      transform: scale(0); animation: ripple .55s ease-out; pointer-events: none;
    }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }

    .playlist-wrap::-webkit-scrollbar, .player-panel::-webkit-scrollbar, .lyrics-body::-webkit-scrollbar { width: 8px; }
    .playlist-wrap::-webkit-scrollbar-thumb, .player-panel::-webkit-scrollbar-thumb, .lyrics-body::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.2); border-radius: 99px;
    }

    @media (max-width: 859px) {
      .artwork { width: 128px; height: 128px; }
      .track { grid-template-columns: 0 40px 1fr auto 36px 36px; gap: 4px 6px; padding: 8px 4px 8px 8px; }
      .t-cover { width: 40px; height: 40px; }
      .t-meta { display: none; }
      .main-header { padding: 14px 14px 10px; }
      .playlist-wrap { padding: 10px 10px 16px; }
      .header-actions .btn { padding: 6px 12px; }
      .dialog { padding: 20px 20px 10px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="player-panel">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <div>
          <h1>Music Player</h1>
          <span>Local · Offline</span>
        </div>
      </div>

      <div class="now-playing">
        <div class="artwork" id="artwork">
          <svg viewBox="0 0 24 24" id="artworkPlaceholder"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <img id="artworkImg" alt="" style="display:none" />
        </div>
        <div class="track-label">Tocando agora</div>
        <div class="track-title empty" id="nowTitle">Nenhuma música selecionada</div>
        <button class="btn btn-outlined" id="btnLyricsNow">
          <svg viewBox="0 0 24 24"><path d="M14 17H4v2h10v-2zm6-8H4v2h16V9zM4 15h16v-2H4v2zM4 5v2h16V5H4z"/></svg>
          Ver letra
        </button>
      </div>

      <div class="progress-section">
        <div class="progress-track" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" id="btnPrev" title="Anterior" aria-label="Anterior">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl ctrl-play" id="btnPlay" title="Play / Pause" aria-label="Play / Pause">
          <svg viewBox="0 0 24 24" id="iconPlay"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" id="iconPause" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl" id="btnNext" title="Próxima" aria-label="Próxima">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <div class="secondary-controls">
        <div class="volume-row">

  <script>
    const ICONS = {
      music: '<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>',
      grip: '<svg viewBox="0 0 24 24"><path d="M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>',
      close: '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
      empty: '<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>',
      lyrics: '<svg viewBox="0 0 24 24"><path d="M14 17H4v2h10v-2zm6-8H4v2h16V9zM4 15h16v-2H4v2zM4 5v2h16V5H4z"/></svg>',
    };

    const DB_NAME = 'MusicPlayerDB';
    const DB_VERSION = 1;
    const STORE_BLOBS = 'blobs';
    const STORE_META = 'meta';
    const META_KEY = 'playlist';
    const MODE_KEY = 'mode';
    const SORT_KEY = 'sort';

    let db = null;
    let tracks = [];
    let currentIndex = -1;
    let mode = 'sequential';
    let sortMode = 'manual';
    let isPlaying = false;
    let shuffleOrder = [];
    let shufflePos = -1;
    let objectUrls = new Map();
    let coverUrls = new Map();

    const audio = document.getElementById('audio');
    const playlistEl = document.getElementById('playlist');
    const nowTitle = document.getElementById('nowTitle');
    const artwork = document.getElementById('artwork');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const btnPlay = document.getElementById('btnPlay');
    const iconPlay = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const volumeEl = document.getElementById('volume');
    const fileInput = document.getElementById('fileInput');
    const trackCountEl = document.getElementById('trackCount');
    const toastEl = document.getElementById('toast');
    const storageInfo = document.getElementById('storageInfo');
    const modeSeq = document.getElementById('modeSeq');
    const modeShuffle = document.getElementById('modeShuffle');
    const btnAdd = document.getElementById('btnAdd');
    const btnDelete = document.getElementById('btnDelete');
    const btnDeleteLabel = document.getElementById('btnDeleteLabel');
    const btnClearAll = document.getElementById('btnClearAll');
    const btnLyricsNow = document.getElementById('btnLyricsNow');
    const deleteBanner = document.getElementById('deleteBanner');
    const playlistWrap = document.getElementById('playlistWrap');
    let deleteMode = false;

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    }

    function formatTime(sec) {
      if (!isFinite(sec) || isNaN(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + String(s).padStart(2, '0');
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function showToast(msg, warn = false) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (warn ? ' warn' : '');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2800);
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function extractCoverArt(blob) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const buf = new Uint8Array(reader.result);
            // ID3v2
            if (buf.length < 10 || buf[0] !== 0x49 || buf[1] !== 0x44 || buf[2] !== 0x33) {
              resolve(null);
              return;
            }
            const ver = buf[3];
            const size = ((buf[6] & 0x7f) << 21) | ((buf[7] & 0x7f) << 14) | ((buf[8] & 0x7f) << 7) | (buf[9] & 0x7f);
            let offset = 10;
            // skip extended header if present
            if (buf[5] & 0x40) {
              if (ver === 4) {
                const es = ((buf[offset] & 0x7f) << 21) | ((buf[offset+1] & 0x7f) << 14) | ((buf[offset+2] & 0x7f) << 7) | (buf[offset+3] & 0x7f);
                offset += es;
              } else {
                const es = (buf[offset] << 24) | (buf[offset+1] << 16) | (buf[offset+2] << 8) | buf[offset+3];
                offset += es;
              }
            }
            const end = Math.min(10 + size, buf.length);
            while (offset + 10 < end) {
              const id = String.fromCharCode(buf[offset], buf[offset+1], buf[offset+2], buf[offset+3]);
              let frameSize;
              if (ver === 4) {
                frameSize = ((buf[offset+4] & 0x7f) << 21) | ((buf[offset+5] & 0x7f) << 14) | ((buf[offset+6] & 0x7f) << 7) | (buf[offset+7] & 0x7f);
              } else {
                frameSize = (buf[offset+4] << 24) | (buf[offset+5] << 16) | (buf[offset+6] << 8) | buf[offset+7];
              }
              if (frameSize <= 0 || offset + 10 + frameSize > buf.length) break;
              if (id === 'APIC' || id === 'PIC') {
                let p = offset + 10;
                const frameEnd = p + frameSize;
                // text encoding
                const encoding = buf[p++];
                let mime = '';
                if (id === 'APIC') {
                  while (p < frameEnd && buf[p] !== 0) { mime += String.fromCharCode(buf[p++]); }
                  p++; // null
                } else {
                  // ID3v2.2 PIC: 3 char image format
                  mime = 'image/' + String.fromCharCode(buf[p], buf[p+1], buf[p+2]).toLowerCase();
                  p += 3;
                }
                if (!mime || mime === 'image/') mime = 'image/jpeg';
                // picture type
                p++;
                // description (null-terminated, encoding dependent)
                if (encoding === 0 || encoding === 3) {
                  while (p < frameEnd && buf[p] !== 0) p++;
                  p++;
                } else {
                  // UTF-16
                  while (p + 1 < frameEnd && !(buf[p] === 0 && buf[p+1] === 0)) p += 2;
                  p += 2;
                }
                if (p >= frameEnd) { resolve(null); return; }
                const imgBytes = buf.slice(p, frameEnd);
                const coverBlob = new Blob([imgBytes], { type: mime.startsWith('image/') ? mime : 'image/jpeg' });
                resolve(coverBlob);
                return;
              }
              offset += 10 + frameSize;
            }
            resolve(null);
          } catch (e) {
            resolve(null);
          }
        };
        reader.onerror = () => resolve(null);
        // only read first ~2MB for tags
        const slice = blob.slice(0, Math.min(blob.size, 2 * 1024 * 1024));
        reader.readAsArrayBuffer(slice);
      });
    }

    function getDurationFromBlob(blob) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(blob);
        const a = new Audio();
        a.preload = 'metadata';
        a.onloadedmetadata = () => {
          const d = a.duration;
          URL.revokeObjectURL(url);
          resolve(isFinite(d) ? d : 0);
        };
        a.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(0);
        };
        a.src = url;
      });
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_BLOBS)) {
            database.createObjectStore(STORE_BLOBS, { keyPath: 'id' });
          }
          if (!database.objectStoreNames.contains(STORE_META)) {
            database.createObjectStore(STORE_META, { keyPath: 'key' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbPut(storeName, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(value);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function idbGet(storeName, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbDelete(storeName, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function saveMeta() {
      await idbPut(STORE_META, { key: META_KEY, tracks });
      await idbPut(STORE_META, { key: MODE_KEY, value: mode });
      await idbPut(STORE_META, { key: SORT_KEY, value: sortMode });
      updateStorageInfo();
    }

    async function loadMeta() {
      const meta = await idbGet(STORE_META, META_KEY);
      if (meta && Array.isArray(meta.tracks)) tracks = meta.tracks;
      const m = await idbGet(STORE_META, MODE_KEY);
      if (m && (m.value === 'shuffle' || m.value === 'sequential')) mode = m.value;
      const s = await idbGet(STORE_META, SORT_KEY);
      if (s && ['manual', 'name', 'duration', 'added'].includes(s.value)) sortMode = s.value;
    }

    async function saveBlob(id, blob) {
      await idbPut(STORE_BLOBS, { id, blob });
    }

    async function getBlob(id) {
      const row = await idbGet(STORE_BLOBS, id);
      return row ? row.blob : null;
    }

    async function deleteBlob(id) {
      await idbDelete(STORE_BLOBS, id);
      if (objectUrls.has(id)) {
        URL.revokeObjectURL(objectUrls.get(id));
        objectUrls.delete(id);
      }
      if (coverUrls.has(id)) {
        URL.revokeObjectURL(coverUrls.get(id));
        coverUrls.delete(id);
      }
    }

    async function getCoverUrl(id) {
      if (coverUrls.has(id)) return coverUrls.get(id);
      const row = await idbGet(STORE_BLOBS, 'cover_' + id);
      if (!row || !row.blob) return null;
      const url = URL.createObjectURL(row.blob);
      coverUrls.set(id, url);
      return url;
    }

    async function getObjectUrl(id) {
      if (objectUrls.has(id)) return objectUrls.get(id);
      const blob = await getBlob(id);
      if (!blob) return null;
      const url = URL.createObjectURL(blob);
      objectUrls.set(id, url);
      return url;
    }

    async function updateStorageInfo() {
      try {
        if (navigator.storage && navigator.storage.estimate) {
          const est = await navigator.storage.estimate();
          const used = est.usage || 0;
          const quota = est.quota || 0;
          storageInfo.textContent = 'Armazenamento: ' + formatSize(used) + ' usados' +
            (quota ? ' · ' + formatSize(quota) + ' disponíveis' : '');
        } else {
          storageInfo.textContent = 'Armazenamento: IndexedDB · ' + tracks.length + ' arquivo(s)';
        }
      } catch {
        storageInfo.textContent = 'Armazenamento: IndexedDB · ' + tracks.length + ' arquivo(s)';
      }
    }

    function renderPlaylist() {
      playlistEl.innerHTML = '';

      if (!tracks.length) {
        playlistEl.innerHTML =
          '<li class="playlist-empty">' + ICONS.empty +
          '<p>Nenhuma música na playlist.<br>Clique em <strong>Adicionar</strong> para incluir arquivos.</p></li>';
        trackCountEl.textContent = '0';
        return;
      }

      tracks.forEach((t, i) => {
        const li = document.createElement('li');
        li.className = 'track' + (i === currentIndex ? ' playing' : '');
        li.draggable = sortMode === 'manual' && !deleteMode;
        li.dataset.index = i;

        li.innerHTML =
          '<span class="t-handle" title="Arraste para reordenar">' + ICONS.grip + '</span>' +
          '<div class="t-cover" data-cover="' + t.id + '">' + ICONS.music + '</div>' +
          '<div class="t-info">' +
            '<div class="t-name" title="' + escapeHtml(t.name) + '">' + escapeHtml(t.name) + '</div>' +
            '<div class="t-meta">' + (t.duration ? formatTime(t.duration) : '—') + ' · #' + (i + 1) + '</div>' +
          '</div>' +
          '<span class="t-duration">' + (t.duration ? formatTime(t.duration) : '—') + '</span>' +
          '<button class="t-lyrics" title="Ver letra" aria-label="Ver letra" data-lyrics="' + i + '">' + ICONS.lyrics + '</button>' +
          '<button class="t-remove" title="Apagar" aria-label="Apagar" data-remove="' + i + '">' + ICONS.close + '</button>';

        // load cover async
        (async (elId, coverEl) => {
          const url = await getCoverUrl(elId);
          if (url && coverEl.isConnected) {
            coverEl.innerHTML = '<img src="' + url + '" alt="" />';
          }
        })(t.id, li.querySelector('[data-cover]'));

        li.addEventListener('click', (e) => {
          if (e.target.closest('[data-remove]') || e.target.closest('[data-lyrics]')) return;
          if (deleteMode) { requestDelete(i); return; }
          playTrack(i);
        });

        if (sortMode === 'manual' && !deleteMode) {
          li.addEventListener('dragstart', onDragStart);
          li.addEventListener('dragover', onDragOver);
          li.addEventListener('dragleave', onDragLeave);
          li.addEventListener('drop', onDrop);
          li.addEventListener('dragend', onDragEnd);
        }

        playlistEl.appendChild(li);
      });

      trackCountEl.textContent = tracks.length === 1 ? '1 música' : tracks.length + ' músicas';
    }

    let dragFrom = null;

    function onDragStart(e) {
      if (sortMode !== 'manual') { e.preventDefault(); return; }
      dragFrom = +e.currentTarget.dataset.index;
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const li = e.currentTarget;
      if (+li.dataset.index !== dragFrom) li.classList.add('drag-over');
    }

    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function onDrop(e) {
      e.preventDefault();
      const to = +e.currentTarget.dataset.index;
      e.currentTarget.classList.remove('drag-over');
      if (dragFrom === null || dragFrom === to) return;

      const item = tracks.splice(dragFrom, 1)[0];
      tracks.splice(to, 0, item);

      if (currentIndex === dragFrom) currentIndex = to;
      else if (dragFrom < currentIndex && to >= currentIndex) currentIndex--;
      else if (dragFrom > currentIndex && to <= currentIndex) currentIndex++;

      if (mode === 'shuffle') buildShuffleOrder(false);
      renderPlaylist();
      saveMeta();
      dragFrom = null;
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      dragFrom = null;
    }

    function applySort(newMode, save = true) {
      const playingId = currentIndex >= 0 ? tracks[currentIndex]?.id : null;
      sortMode = newMode;

      document.querySelectorAll('.sort-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.sort === sortMode);
      });

      if (sortMode === 'name') {
        tracks.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));
      } else if (sortMode === 'duration') {
        tracks.sort((a, b) => (a.duration || 0) - (b.duration || 0));
      } else if (sortMode === 'added') {
        tracks.sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));
      }

      if (playingId) {
        const idx = tracks.findIndex(t => t.id === playingId);
        currentIndex = idx >= 0 ? idx : -1;
      }

      if (mode === 'shuffle') buildShuffleOrder(false);
      renderPlaylist();
      if (save) saveMeta();
    }

    function setPlayIcon(playing) {
      iconPlay.style.display = playing ? 'none' : 'block';
      iconPause.style.display = playing ? 'block' : 'none';
      artwork.classList.toggle('playing', playing);
    }

    async function playTrack(index) {
      if (index < 0 || index >= tracks.length) return;
      currentIndex = index;
      const t = tracks[index];
      const url = await getObjectUrl(t.id);
      if (!url) {
        showToast('Arquivo não encontrado no armazenamento.', true);
        return;
      }
      audio.src = url;
      try {
        await audio.play();
        isPlaying = true;
        setPlayIcon(true);
      } catch {
        showToast('Erro ao reproduzir este arquivo.', true);
      }
      nowTitle.textContent = t.name;
      nowTitle.classList.remove('empty');
      const artImg = document.getElementById('artworkImg');
      const artPh = document.getElementById('artworkPlaceholder');
      const coverUrl = await getCoverUrl(t.id);
      if (coverUrl) {
        artImg.src = coverUrl;
        artImg.style.display = 'block';
        if (artPh) artPh.style.display = 'none';
      } else {
        artImg.style.display = 'none';
        artImg.removeAttribute('src');
        if (artPh) artPh.style.display = 'block';
      }
      renderPlaylist();
    }

    function togglePlay() {
      if (!tracks.length) {
        showToast('Adicione músicas primeiro');
        return;
      }
      if (currentIndex < 0) {
        if (mode === 'shuffle') {
          buildShuffleOrder(true);
          playTrack(shuffleOrder[0]);
        } else {
          playTrack(0);
        }
        return;
      }
      if (audio.paused) {
        audio.play().then(() => {
          isPlaying = true;
          setPlayIcon(true);
        }).catch(() => {
          showToast('Erro ao reproduzir.', true);
        });
      } else {
        audio.pause();
        isPlaying = false;
        setPlayIcon(false);
      }
    }

    function nextTrack() {
      if (!tracks.length) return;
      if (mode === 'shuffle') {
        if (!shuffleOrder.length) buildShuffleOrder(true);
        shufflePos = (shufflePos + 1) % shuffleOrder.length;
        if (shufflePos === 0) buildShuffleOrder(true);
        playTrack(shuffleOrder[shufflePos]);
      } else {
        playTrack((currentIndex + 1) % tracks.length);
      }
    }

    function prevTrack() {
      if (!tracks.length) return;
      if (audio.currentTime > 5) {
        audio.currentTime = 0;
        return;
      }
      if (mode === 'shuffle') {
        if (!shuffleOrder.length) buildShuffleOrder(true);
        shufflePos = (shufflePos - 1 + shuffleOrder.length) % shuffleOrder.length;
        playTrack(shuffleOrder[shufflePos]);
      } else {
        playTrack((currentIndex - 1 + tracks.length) % tracks.length);
      }
    }

    function buildShuffleOrder(resetPos) {
      shuffleOrder = tracks.map((_, i) => i);
      for (let i = shuffleOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
      }
      if (currentIndex >= 0 && shuffleOrder.length > 1 && shuffleOrder[0] === currentIndex) {
        [shuffleOrder[0], shuffleOrder[1]] = [shuffleOrder[1], shuffleOrder[0]];
      }
      if (resetPos) {
        shufflePos = 0;
        if (currentIndex >= 0) {
          const idx = shuffleOrder.indexOf(currentIndex);
          if (idx >= 0) shufflePos = idx;
        }
      }
    }

    function setMode(m) {
      mode = m;

    async function addFiles(fileList) {
      const files = Array.from(fileList).filter(f =>

          tracks.push({

            hasCover: !!cover
          });
          added++;
        } catch (e) {

          showToast('Erro ao salvar: ' + file.name, true);
        }
      }

      if (sortMode !== 'manual') applySort(sortMode, false);
      else renderPlaylist();
      await saveMeta();
      if (added) showToast(added + ' música(s) adicionada(s)');
    }

    function parseName(name) {
      let n = name.replace(/\.[^.]+$/, '').replace(/_+/g, ' ');
      n = n.replace(/^\s*\d{1,3}\s*[-.)]\s*/, '');
      n = n.replace(/[\(\[][^\)\]]*(official|oficial|lyric|letra|video|vídeo|áudio|audio|hd|4k|clipe|clip|ao vivo|live|visualizer)[^\)\]]*[\)\]]/gi, '');
      n = n.replace(/\s+/g, ' ').trim();
      const parts = n.split(/\s+[-–]\s+/);
      if (parts.length >= 2) return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
      return { artist: '', title: n };
    }

    function decodeId3Text(bytes) {
      if (!bytes.length) return '';
      const enc = bytes[0];
      let data = bytes.slice(1);
      let label = 'windows-1252';
      if (enc === 1) {
        label = 'utf-16le';
        if (data[0] === 0xFE && data[1] === 0xFF) label = 'utf-16be';
      } else if (enc === 2) label = 'utf-16be';
      else if (enc === 3) label = 'utf-8';
      try {
        return new TextDecoder(label).decode(data).split('\0')[0].replace(/^\uFEFF/, '').trim();
      } catch { return ''; }
    }

    async function readTags(blob) {
      try {
        const buf = new Uint8Array(await blob.slice(0, 512 * 1024).arrayBuffer());
        if (buf[0] !== 0x49 || buf[1] !== 0x44 || buf[2] !== 0x33) return {};
        const ver = buf[3];
        const sync = (a) => ((buf[a] & 0x7f) << 21) | ((buf[a+1] & 0x7f) << 14) | ((buf[a+2] & 0x7f) << 7) | (buf[a+3] & 0x7f);
        const end = Math.min(10 + sync(6), buf.length);
        let off = 10;
        if (buf[5] & 0x40) off += (ver === 4 ? sync(off) : ((buf[off] << 24) | (buf[off+1] << 16) | (buf[off+2] << 8) | buf[off+3]));
        const idLen = ver === 2 ? 3 : 4;
        const hdr = ver === 2 ? 6 : 10;
        const out = {};
        while (off + hdr < end) {
          if (buf[off] === 0) break;
          const id = String.fromCharCode(...buf.slice(off, off + idLen));
          let fs;
          if (ver === 2) fs = (buf[off+3] << 16) | (buf[off+4] << 8) | buf[off+5];
          else if (ver === 4) fs = sync(off + 4);
          else fs = (buf[off+4] << 24) | (buf[off+5] << 16) | (buf[off+6] << 8) | buf[off+7];
          if (fs <= 0 || off + hdr + fs > buf.length) break;
          const body = buf.slice(off + hdr, off + hdr + fs);
          if (id === 'TIT2' || id === 'TT2') out.title = decodeId3Text(body);
          else if (id === 'TPE1' || id === 'TP1') out.artist = decodeId3Text(body);
          off += hdr + fs;
        }
        return out;
      } catch { return {}; }
    }

      const parsed = parseName(t.name);
      lyTitle.value = parsed.title;

      lyricsHeading.textContent = parsed.title || 'Letra';
      setLyricsView('Buscando letra...', true);

      const myToken = ++lySearchToken;
      try {
        const blob = await getBlob(t.id);
        const tags = blob ? await readTags(blob) : {};
        if (myToken !== lySearchToken || lyTrackId !== t.id) return;
        if (tags.title) {
          lyTitle.value = tags.title;
          lyArtist.value = tags.artist || '';
          lyricsHeading.textContent = tags.title;
        }
      } catch {}
      searchLyrics();
    }

    async function fetchLyrics(title, artist) {
      const tryQuery = async (params) => {
        const r = await fetch('https://lrclib.net/api/search?' + params.toString());
        if (!r.ok) throw new Error('http ' + r.status);
        const list = await r.json();
        return Array.isArray(list) ? list.find(x => x && x.plainLyrics && x.plainLyrics.trim()) : null;
      };
      let hit = null;
      if (artist) {
        hit = await tryQuery(new URLSearchParams({ track_name: title, artist_name: artist }));
        if (!hit) hit = await tryQuery(new URLSearchParams({ q: artist + ' ' + title }));
      } else {
        hit = await tryQuery(new URLSearchParams({ q: title }));
      }
      if (!hit && artist) hit = await tryQuery(new URLSearchParams({ track_name: title }));
      return hit;
    }

    async function searchLyrics() {
      const t = tracks.find(x => x.id === lyTrackId);
      if (!t) return;
      const title = lyTitle.value.trim();
      const artist = lyArtist.value.trim();
      if (!title) { showToast('Digite o nome da música', true); return; }
      const myToken = ++lySearchToken;
      stopEditing();
      lyBtnSearch.disabled = true;
      setLyricsView('Buscando letra...', true);
      try {
        const hit = await fetchLyrics(title, artist);
        if (myToken !== lySearchToken || lyTrackId !== t.id) return;
        if (hit) {
          t.lyrics = hit.plainLyrics.replace(/\r\n/g, '\n').trim();
          t.lyricsTitle = title;
          t.lyricsArtist = artist;
          lyricsHeading.textContent = title;
          setLyricsView(t.lyrics, false);
          saveMeta();
        } else {
          setLyricsView('Letra não encontrada.\n\nAjuste o nome da música e do artista e toque em Buscar, ou toque em Editar para colar a letra manualmente.', true);
        }
      } catch (err) {
        if (myToken !== lySearchToken) return;
        setLyricsView('Não foi possível buscar a letra. Verifique sua conexão com a internet e tente de novo, ou toque em Editar para colar a letra manualmente.', true);
      } finally {
        lyBtnSearch.disabled = false;
      }
    }

    function loadJsPdf() {
      if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve();

    function pdfSafe(str) {
      return str
        .replace(/[\u2018\u2019\u201B]/g, "'")
        .replace(/[\u201C\u201D\u201E]/g, '"')
        .replace(/[\u2013\u2014]/g, '-')
        .replace(/\u2026/g, '...')
        .replace(/\u00A0/g, ' ')
        .replace(/[^\x09\x0A\x20-\x7E\u00A1-\u00FF]/g, '');
    }

    lyDownload.addEventListener('click', async () => {

      let text = lyEditing ? lyricsEdit.value : (t && t.lyrics);
      if (!text || !text.trim()) { showToast('Não há letra para baixar', true); return; }
      const title = lyTitle.value.trim() || (t ? parseName(t.name).title : 'Letra');
      lyDownload.disabled = true;
      try {
        await loadJsPdf();
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'pt', format: 'a4' });
        const W = doc.internal.pageSize.getWidth();
        const H = doc.internal.pageSize.getHeight();
        const margin = 56;
        const maxW = W - margin * 2;
        let y = margin + 18;

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(24);
        const titleLines = doc.splitTextToSize(pdfSafe(title), maxW);
        titleLines.forEach((ln) => {
          doc.text(ln, W / 2, y, { align: 'center' });
          y += 30;
        });
        y += 18;

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(12);
        const lh = 17;
        pdfSafe(text.replace(/\r\n/g, '\n')).split('\n').forEach((line) => {
          const wrapped = line.trim() ? doc.splitTextToSize(line, maxW) : [''];
          wrapped.forEach((w) => {
            if (y > H - margin) { doc.addPage(); y = margin + 12; }
            if (w) doc.text(w, margin, y, { align: 'left' });
            y += lh;
          });
        });

        const fname = (pdfSafe(title).replace(/[\\/:*?"<>|]+/g, '').trim() || 'letra') + '.pdf';
        doc.save(fname);
      } catch (e) {
        console.error(e);

    /* ---------- PWA (instalável no celular) ---------- */
    function drawIcon(size) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      g.fillStyle = '#000000';
      g.fillRect(0, 0, size, size);
      g.fillStyle = '#e53935';
      g.beginPath();
      g.arc(size / 2, size / 2, size * 0.34, 0, Math.PI * 2);
      g.fill();
      const k = (size * 0.36) / 24;
      g.save();
      g.translate(size / 2 - 12 * k, size / 2 - 12 * k);
      g.scale(k, k);
      g.fillStyle = '#ffffff';
      g.fill(new Path2D('M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'));
      g.restore();
      return c.toDataURL('image/png');
    }

    function setupPWA() {
      try {
        const i192 = drawIcon(192);
        const i512 = drawIcon(512);
        const base = location.href.split('#')[0].split('?')[0];
        const scope = base.replace(/[^/]*$/, '');
        const manifest = {
          id: base,
          name: 'Music Player',
          short_name: 'Music Player',
          description: 'Player de músicas local e offline',
          lang: 'pt-BR',
          start_url: base,
          scope: scope,
          display: 'standalone',
          orientation: 'any',
          background_color: '#000000',
          theme_color: '#000000',
          icons: [
            { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
            { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' },
            { src: i192, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
            { src: i512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
          ]
        };
        const mUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = mUrl;
        document.head.appendChild(link);
        const apple = document.createElement('link');
        apple.rel = 'apple-touch-icon';
        apple.href = i192;
        document.head.appendChild(apple);
        const fav = document.createElement('link');
        fav.rel = 'icon';
        fav.type = 'image/png';
        fav.href = i192;
        document.head.appendChild(fav);
      } catch (e) { console.warn('PWA manifest:', e); }

      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    }
    setupPWA();

    /* ---------- Efeito ripple (Material) ---------- */
    document.addEventListener('pointerdown', (e) => {
      const el = e.target.closest('.btn, .m-btn, .ctrl, .icon-btn, .mode-btn, .sort-btn, .t-remove, .t-lyrics');
      if (!el || el.disabled) return;
      const r = el.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const sp = document.createElement('span');
      sp.className = 'ripple-span';
      sp.style.width = sp.style.height = size + 'px';
      sp.style.left = (e.clientX - r.left - size / 2) + 'px';
      sp.style.top = (e.clientY - r.top - size / 2) + 'px';
      el.appendChild(sp);
      setTimeout(() => sp.remove(), 600);
    });

    (async () => {
      try {
        db = await openDB();
        await loadMeta();
        modeSeq.classList.toggle('active', mode === 'sequential');
        modeShuffle.classList.toggle('active', mode === 'shuffle');
        document.querySelectorAll('.sort-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.sort === sortMode);
        });
        renderPlaylist();
        updateStorageInfo();
        if (tracks.length) showToast(tracks.length + ' música(s) carregada(s)');
      } catch (e) {
        console.error(e);
        showToast('Erro ao abrir armazenamento local.', true);
        renderPlaylist();
      }
    })();
  </script>
</body>
</html>
