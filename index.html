<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Music Player" />
  <title>Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0c;
      --bg-elevated: #15151a;
      --surface: #1c1c22;
      --surface-hover: #25252d;
      --surface-2: #2e2e38;
      --border: rgba(255, 255, 255, 0.14);
      --border-subtle: rgba(255, 255, 255, 0.07);
      --text: #f2f2f5;
      --text-secondary: #b0b0ba;
      --text-muted: #7a7a88;
      --primary: #e53935;
      --primary-light: #ff6b5e;
      --primary-dark: #9e0b0b;
      --primary-muted: rgba(229, 57, 53, 0.22);
      --primary-hover: rgba(229, 57, 53, 0.14);
      --primary-border: rgba(255, 120, 100, 0.55);
      /* Skeuomorphic shadows */
      --e1: 0 1px 0 rgba(255,255,255,0.06), 0 2px 4px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
      --e2: 0 1px 0 rgba(255,255,255,0.08), 0 3px 8px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
      --e6: 0 2px 0 rgba(255,255,255,0.05), 0 8px 20px rgba(0,0,0,0.55), 0 3px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.07);
      --e24: 0 12px 40px rgba(0,0,0,0.65), 0 4px 12px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
      --inset: inset 0 2px 4px rgba(0,0,0,0.55), inset 0 1px 1px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.04);
      --radius: 8px;
      --font: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { background: var(--bg); }

    body {
      font-family: var(--font);
      background:
        radial-gradient(ellipse 120% 80% at 50% -20%, #1a1218 0%, transparent 50%),
        linear-gradient(180deg, #0e0e12 0%, #08080a 100%);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .shell {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (min-width: 860px) {
      .shell {
        grid-template-columns: 340px 1fr;
        grid-template-rows: 1fr;
        height: 100vh;
        height: 100dvh;
        max-height: 100dvh;
      }
    }

    /* ---------- Painel do player (skeuomorphic) ---------- */
    .player-panel {
      background:
        linear-gradient(165deg, #22222a 0%, #16161c 40%, #121218 100%);
      border-bottom: 1px solid rgba(0,0,0,0.6);
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 20px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.05),
        0 8px 24px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.07);
      position: relative;
      z-index: 1;
    }

    @media (min-width: 860px) {
      .player-panel {
        border-bottom: none;
        border-right: 1px solid rgba(0,0,0,0.55);
        box-shadow:
          4px 0 20px rgba(0,0,0,0.35),
          inset -1px 0 0 rgba(255,255,255,0.04),
          inset 0 1px 0 rgba(255,255,255,0.06);
        overflow-y: auto;
        padding: 24px;
      }
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .brand-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.12),
        0 4px 10px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.15);
      overflow: hidden;
      background: #0a0a0c;
      border: 1px solid rgba(0,0,0,0.5);
    }
    .brand-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brand-icon svg { width: 22px; height: 22px; fill: #fff; }

    .brand h1 {
      font-size: 1.3rem; font-weight: 600; letter-spacing: 0.01em; line-height: 1.2;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7), 0 -1px 0 rgba(255,255,255,0.06);
    }
    .brand span {
      display: block; font-size: 0.72rem; color: var(--text-muted); margin-top: 3px;
      letter-spacing: 0.06em; text-transform: uppercase;
      text-shadow: 0 1px 1px rgba(0,0,0,0.5);
    }

    .now-playing { text-align: center; padding: 4px 0 0; }

    .artwork {
      width: 172px; height: 172px;
      margin: 0 auto 20px;
      border-radius: 14px;
      background:
        linear-gradient(145deg, #2a2a32 0%, #1a1a20 100%);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.1),
        0 12px 28px rgba(0,0,0,0.55),
        0 4px 8px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -2px 6px rgba(0,0,0,0.35);
      border: 1px solid rgba(0,0,0,0.45);
    }
    .artwork svg { width: 56px; height: 56px; fill: var(--text-muted); opacity: .55; }
    .artwork img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 12px; }
    .artwork.playing::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(229,57,53,.32) 0%, transparent 68%);
      animation: pulse 2.5s ease-in-out infinite; pointer-events: none;
      border-radius: inherit;
    }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

    .track-label {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--primary-light); margin-bottom: 5px; font-weight: 600;
      text-shadow: 0 0 12px rgba(255,107,94,0.35), 0 1px 1px rgba(0,0,0,0.5);
    }
    .track-title {
      font-size: 1.12rem; font-weight: 500; line-height: 1.35;
      word-break: break-word; padding: 0 4px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .track-title.empty { color: var(--text-muted); font-weight: 400; font-size: .9rem; }

    .progress-section { display: flex; flex-direction: column; gap: 6px; }
    .progress-track {
      height: 10px;
      background:
        linear-gradient(180deg, #0c0c10 0%, #1a1a20 100%);
      border-radius: 99px;
      cursor: pointer;
      position: relative;
      margin: 10px 0 6px;
      box-shadow: var(--inset);
      border: 1px solid rgba(0,0,0,0.5);
    }
    .progress-track::before { content: ''; position: absolute; inset: -14px 0; }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(180deg, #ff6b5e 0%, #e53935 45%, #b71c1c 100%);
      border-radius: 99px;
      pointer-events: none;
      position: relative;
      box-shadow:
        0 0 10px rgba(229,57,53,0.45),
        inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .progress-fill::after {
      content: '';
      position: absolute; right: -8px; top: 50%;
      width: 18px; height: 18px; margin-top: -9px;
      background:
        radial-gradient(circle at 35% 30%, #fff 0%, #ff8a7a 25%, #e53935 60%, #9e0b0b 100%);
      border-radius: 50%;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.4),
        0 3px 8px rgba(0,0,0,0.55),
        inset 0 -2px 3px rgba(0,0,0,0.35);
      border: 1px solid rgba(0,0,0,0.3);
    }
    .time-row {
      display: flex; justify-content: space-between;
      font-size: 0.75rem; color: var(--text-muted);
      font-variant-numeric: tabular-nums; letter-spacing: 0.03em;
      text-shadow: 0 1px 1px rgba(0,0,0,0.5);
    }

    .controls { display: flex; align-items: center; justify-content: center; gap: 16px; }

    .ctrl, .icon-btn {
      width: 50px; height: 50px; border: none;
      background:
        linear-gradient(180deg, #2e2e38 0%, #1c1c24 100%);
      color: var(--text-secondary);
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .12s, box-shadow .12s, filter .12s;
      position: relative; overflow: hidden; font-family: inherit;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.12),
        0 4px 10px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.1),
        inset 0 -2px 4px rgba(0,0,0,0.3);
      border: 1px solid rgba(0,0,0,0.4);
    }
    .ctrl:hover, .icon-btn:hover {
      color: #fff;
      filter: brightness(1.12);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.15),
        0 5px 14px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.14);
    }
    .ctrl:active, .icon-btn:active {
      transform: translateY(1px);
      box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.55),
        0 1px 0 rgba(255,255,255,0.05);
    }
    .ctrl svg, .icon-btn svg { width: 24px; height: 24px; fill: currentColor; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)); }

    .ctrl-play {
      width: 72px; height: 72px;
      background:
        linear-gradient(180deg, #ff6b5e 0%, #e53935 40%, #b71c1c 100%);
      color: #fff;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.35),
        0 8px 22px rgba(229,57,53,0.4),
        0 3px 8px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.4),
        inset 0 -3px 6px rgba(0,0,0,0.25);
      border: 1px solid rgba(120,20,15,0.6);
    }
    .ctrl-play:hover {
      background: linear-gradient(180deg, #ff7f74 0%, #f44336 40%, #c62828 100%);
      filter: none;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.4),
        0 10px 28px rgba(229,57,53,0.5),
        0 4px 10px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.45);
    }
    .ctrl-play:active {
      background: linear-gradient(180deg, #c62828 0%, #e53935 60%, #ff6b5e 100%);
      box-shadow:
        inset 0 3px 10px rgba(0,0,0,0.45),
        0 1px 0 rgba(255,255,255,0.15);
    }
    .ctrl-play svg { width: 32px; height: 32px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }

    .secondary-controls { display: flex; flex-direction: column; gap: 16px; }

    .volume-row { display: flex; align-items: center; gap: 14px; padding: 2px 2px; }
    .volume-row svg { width: 22px; height: 22px; fill: var(--text-muted); flex-shrink: 0; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
    .volume-row input[type="range"] {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 10px;
      background: linear-gradient(180deg, #0c0c10 0%, #1a1a20 100%);
      border-radius: 99px; outline: none;
      box-shadow: var(--inset);
      border: 1px solid rgba(0,0,0,0.45);
    }
    .volume-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0%, #ff8a7a 25%, #e53935 60%, #9e0b0b 100%);
      cursor: pointer; border: 1px solid rgba(0,0,0,0.35);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.35),
        0 3px 8px rgba(0,0,0,0.5),
        inset 0 -2px 3px rgba(0,0,0,0.3);
    }
    .volume-row input[type="range"]::-moz-range-thumb {
      width: 20px; height: 20px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0%, #ff8a7a 25%, #e53935 60%, #9e0b0b 100%);
      cursor: pointer; border: 1px solid rgba(0,0,0,0.35);
      box-shadow: 0 2px 6px rgba(0,0,0,0.45);
    }

    .mode-group { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .mode-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 12px;
      border: 1px solid rgba(0,0,0,0.45);
      background: linear-gradient(180deg, #2a2a32 0%, #1a1a22 100%);
      color: var(--text-secondary);
      font-size: .78rem; font-weight: 600; font-family: inherit;
      text-transform: uppercase; letter-spacing: .05em;
      cursor: pointer;
      transition: all .15s;
      position: relative; overflow: hidden;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.08),
        inset 0 1px 0 rgba(255,255,255,0.06);
      text-shadow: 0 1px 1px rgba(0,0,0,0.5);
    }
    .mode-btn:first-child { border-radius: 10px 0 0 10px; }
    .mode-btn:last-child { border-radius: 0 10px 10px 0; border-left: none; }
    .mode-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .mode-btn.active {
      background: linear-gradient(180deg, #ff6b5e 0%, #e53935 50%, #b71c1c 100%);
      color: #fff;
      border-color: rgba(120,20,15,0.5);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.25),
        0 3px 10px rgba(229,57,53,0.35),
        inset 0 1px 0 rgba(255,255,255,0.3),
        inset 0 -2px 4px rgba(0,0,0,0.25);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .mode-btn.active:last-child { border-left: 1px solid rgba(120,20,15,0.4); }
    .mode-btn:hover:not(.active) {
      background: linear-gradient(180deg, #34343e 0%, #22222a 100%);
      color: var(--text);
    }
    .mode-btn:active:not(.active) {
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
    }

    /* ---------- Painel principal ---------- */
    .main-panel {
      display: flex; flex-direction: column; min-height: 0;
      background:
        linear-gradient(180deg, #121216 0%, #0a0a0e 100%);
    }

    .main-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid rgba(0,0,0,0.5);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04);
      display: flex; flex-direction: column; gap: 14px; flex-shrink: 0;
      background: linear-gradient(180deg, #1a1a22 0%, #14141a 100%);
    }
    .main-header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .main-header h2 {
      font-size: 1.25rem; font-weight: 600; letter-spacing: .01em;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6), 0 -1px 0 rgba(255,255,255,0.05);
    }
    .track-count { font-size: .8125rem; color: var(--text-muted); font-weight: 400; margin-left: 8px; }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* Botões skeuomorphic */
    .btn, .m-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 7px 16px; min-height: 36px;
      border: 1px solid rgba(0,0,0,0.4);
      background: linear-gradient(180deg, #2e2e38 0%, #1e1e26 100%);
      color: var(--primary-light);
      font-size: .78rem; font-weight: 600; font-family: inherit;
      text-transform: uppercase; letter-spacing: .04em; line-height: 1.75;
      border-radius: 10px; cursor: pointer;
      transition: all .12s;
      white-space: nowrap; position: relative; overflow: hidden;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.1),
        0 3px 8px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.08);
      text-shadow: 0 1px 1px rgba(0,0,0,0.5);
    }
    .btn svg { width: 18px; height: 18px; fill: currentColor; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)); }
    .btn:hover, .m-btn:hover {
      filter: brightness(1.1);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.12),
        0 4px 12px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .btn:active, .m-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
    }
    .btn:disabled { opacity: .4; cursor: default; filter: none; }

    .btn-contained, .m-btn.contained {
      background: linear-gradient(180deg, #ff6b5e 0%, #e53935 45%, #b71c1c 100%);
      color: #fff;
      border-color: rgba(120,20,15,0.55);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.3),
        0 4px 12px rgba(229,57,53,0.35),
        inset 0 1px 0 rgba(255,255,255,0.35);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .btn-contained:hover, .m-btn.contained:hover {
      background: linear-gradient(180deg, #ff7f74 0%, #f44336 45%, #c62828 100%);
      filter: none;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.35),
        0 5px 16px rgba(229,57,53,0.45),
        inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .btn-outlined {
      border-color: rgba(255,120,100,0.45);
      background: linear-gradient(180deg, #2a2224 0%, #1c1618 100%);
    }
    .btn-outlined.active {
      background: linear-gradient(180deg, #ff6b5e 0%, #e53935 50%, #b71c1c 100%);
      color: #fff;
      border-color: rgba(120,20,15,0.5);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.25),
        0 3px 10px rgba(229,57,53,0.3),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .btn-outlined.active:hover { filter: brightness(1.05); }

    .delete-banner {
      display: flex; align-items: center; gap: 10px;
      background: linear-gradient(180deg, rgba(229,57,53,0.25) 0%, rgba(180,30,25,0.2) 100%);
      border: 1px solid rgba(255,100,80,0.4);
      color: var(--primary-light);
      border-radius: 10px;
      padding: 11px 14px; font-size: .875rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 2px 8px rgba(0,0,0,0.3);
      text-shadow: 0 1px 1px rgba(0,0,0,0.4);
    }
    .delete-banner[hidden] { display: none; }
    .delete-banner svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

    .sort-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sort-label {
      font-size: .72rem; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: .1em; font-weight: 600;
      text-shadow: 0 1px 1px rgba(0,0,0,0.5);
    }
    .sort-btn {
      padding: 5px 13px; min-height: 30px;
      border: 1px solid rgba(0,0,0,0.4);
      background: linear-gradient(180deg, #2a2a32 0%, #1c1c24 100%);
      color: var(--text-secondary);
      font-size: .78rem; font-weight: 500; font-family: inherit;
      border-radius: 16px; cursor: pointer;
      transition: all .12s;
      display: inline-flex; align-items: center; gap: 6px; position: relative; overflow: hidden;
      box-shadow: 0 1px 0 rgba(255,255,255,0.07), inset 0 1px 0 rgba(255,255,255,0.05);
      text-shadow: 0 1px 1px rgba(0,0,0,0.4);
    }
    .sort-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .sort-btn:hover {
      background: linear-gradient(180deg, #34343e 0%, #24242c 100%);
      color: var(--text);
    }
    .sort-btn.active {
      color: #fff;
      background: linear-gradient(180deg, #ff6b5e 0%, #e53935 55%, #b71c1c 100%);
      border-color: rgba(120,20,15,0.5);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.25),
        0 2px 8px rgba(229,57,53,0.3),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }

    .playlist-wrap { flex: 1; overflow-y: auto; min-height: 0; padding: 12px 16px 16px; }
    .playlist { list-style: none; }

    .playlist-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 48px 24px; color: var(--text-muted); text-align: center;
    }
    .playlist-empty svg { width: 48px; height: 48px; fill: var(--text-muted); opacity: .5; }
    .playlist-empty p { font-size: .9rem; text-shadow: 0 1px 1px rgba(0,0,0,0.4); }

    .track {
      display: grid; grid-template-columns: 24px 44px 1fr auto 36px;
      align-items: center; gap: 4px 10px; padding: 9px 8px 9px 10px;
      border-radius: 10px; cursor: pointer;
      transition: all .15s;
      user-select: none; margin-bottom: 9px;
      background: linear-gradient(180deg, #24242c 0%, #1a1a20 100%);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.06),
        0 2px 6px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.04);
      border: 1px solid rgba(0,0,0,0.35);
    }
    .track:hover {
      background: linear-gradient(180deg, #2c2c36 0%, #22222a 100%);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.08),
        0 3px 10px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .track.playing {
      background: linear-gradient(180deg, #3a2224 0%, #2a181a 100%);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.08),
        0 2px 8px rgba(229,57,53,0.2),
        inset 3px 0 0 #e53935,
        inset 0 1px 0 rgba(255,150,130,0.12);
      border-color: rgba(229,57,53,0.25);
    }
    .track.playing .t-name { color: var(--primary-light); font-weight: 600; text-shadow: 0 0 10px rgba(255,107,94,0.3); }
    .track.dragging { opacity: .4; }
    .track.drag-over { box-shadow: inset 0 3px 0 0 var(--primary); }

    .delete-mode .track {
      box-shadow:
        0 1px 0 rgba(255,255,255,0.05),
        0 2px 6px rgba(0,0,0,0.3),
        inset 0 0 0 1px rgba(229,57,53,.45);
    }
    .delete-mode .track:hover {
      background: linear-gradient(180deg, #3a2224 0%, #2a181a 100%);
      box-shadow: 0 2px 8px rgba(0,0,0,0.35), inset 0 0 0 1px var(--primary);
    }

    .t-cover {
      width: 44px; height: 44px; border-radius: 8px;
      background: linear-gradient(145deg, #2e2e38 0%, #1a1a20 100%);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.05);
      border: 1px solid rgba(0,0,0,0.3);
    }
    .t-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .t-cover svg { width: 20px; height: 20px; fill: var(--text-muted); opacity: .6; }

    .t-handle {
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); cursor: grab; opacity: 0; transition: opacity .15s;
    }
    .track:hover .t-handle { opacity: 1; }
    .t-handle svg { width: 16px; height: 16px; fill: currentColor; }
    .delete-mode .t-handle { visibility: hidden; }

    .t-info { min-width: 0; overflow: hidden; }
    .t-name {
      font-size: .9375rem;
      white-space: nowrap;
      overflow: hidden;
      position: relative;
    }
    .t-name .marquee-inner {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
    }
    .t-name.marquee .marquee-inner {
      animation: marquee-scroll var(--marquee-duration, 9s) linear infinite;
    }
    .t-name.marquee:hover .marquee-inner {
      animation-play-state: paused;
    }
    /* Continuous scroll by duplicating text */
    .t-name.marquee .marquee-inner::after {
      content: '   ·   ' attr(data-text);
    }
    @keyframes marquee-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .t-meta { font-size: .75rem; color: var(--text-muted); margin-top: 1px; }
    .t-duration { font-size: .8125rem; color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 36px; text-align: right; }

    .t-remove {
      width: 36px; height: 36px; border: none;
      background: linear-gradient(180deg, #2a2a32 0%, #1c1c24 100%);
      color: var(--text-muted);
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .12s; position: relative; overflow: hidden;
      box-shadow: 0 1px 0 rgba(255,255,255,0.06), 0 2px 4px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
      border: 1px solid rgba(0,0,0,0.35);
    }
    .t-remove svg { width: 18px; height: 18px; fill: currentColor; }
    .t-remove:hover {
      background: linear-gradient(180deg, #3a2224 0%, #2a181a 100%);
      color: var(--primary-light);
      box-shadow: 0 1px 0 rgba(255,150,130,0.15), 0 2px 6px rgba(229,57,53,0.2);
    }
    .t-remove:active {
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }

    @media (hover: none) {
      .t-handle { display: none; }
    }

    input[type="file"] { display: none; }

    .storage-status { font-size: .75rem; color: var(--text-muted); padding: 0 20px 12px; text-align: right; flex-shrink: 0; }

    /* ---------- Toast (Snackbar) ---------- */
    .toast {
      position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(180deg, #3a3a44 0%, #2a2a32 100%);
      color: #fff; padding: 13px 22px; border-radius: 12px;
      font-size: .875rem;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.1),
        0 10px 30px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.08);
      border: 1px solid rgba(0,0,0,0.4);
      opacity: 0;
      transition: all .3s cubic-bezier(.16,1,.3,1); z-index: 400; max-width: 90vw; pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.warn { border-left: 4px solid var(--primary); box-shadow: 0 1px 0 rgba(255,255,255,0.1), 0 10px 30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08), -2px 0 12px rgba(229,57,53,0.25); }

    /* ---------- Dialogs (Modal) ---------- */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.78);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 300;
      backdrop-filter: blur(4px);
    }
    .modal-backdrop[hidden] { display: none; }
    #confirmModal { z-index: 350; }

    .dialog {
      background: linear-gradient(165deg, #2a2a34 0%, #1a1a22 100%);
      border-radius: 14px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.1),
        0 20px 50px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,255,0.08);
      border: 1px solid rgba(0,0,0,0.5);
      width: 100%; max-width: 420px; padding: 24px 24px 12px;
      animation: dialogIn .22s ease-out;
    }
    @keyframes dialogIn { from { transform: scale(.9) translateY(8px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    .dialog h3 {
      font-size: 1.15rem; font-weight: 600; line-height: 1.4; word-break: break-word; margin-bottom: 8px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .dialog p { color: var(--text-secondary); font-size: .9rem; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 0 4px; }
    .dialog-actions .m-btn.text { margin-right: auto; }
    #confirmModal .dialog-actions .m-btn.text { margin-right: 0; }

    /* ---------- Press feedback (skeuomorphic) ---------- */
    .ripple-span {
      position: absolute; border-radius: 50%; background: rgba(255,255,255,.18);
      transform: scale(0); animation: ripple .45s ease-out; pointer-events: none;
    }
    @keyframes ripple { to { transform: scale(3.5); opacity: 0; } }

    .playlist-wrap::-webkit-scrollbar, .player-panel::-webkit-scrollbar { width: 9px; }
    .playlist-wrap::-webkit-scrollbar-track, .player-panel::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.25); border-radius: 99px;
    }
    .playlist-wrap::-webkit-scrollbar-thumb, .player-panel::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #3a3a44 0%, #2a2a32 100%);
      border-radius: 99px;
      border: 1px solid rgba(0,0,0,0.3);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    @media (max-width: 859px) {
      .artwork { width: 128px; height: 128px; }
      .track { grid-template-columns: 0 40px 1fr auto 36px; gap: 4px 6px; padding: 8px 4px 8px 8px; }
      .t-cover { width: 40px; height: 40px; }
      .t-meta { display: none; }

      .playlist-wrap { padding: 10px 10px 16px; }
      .header-actions .btn { padding: 6px 12px; }
      .dialog { padding: 20px 20px 10px; }
    }
  </style>
</head>

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);

    function formatTime(sec) {
      if (!isFinite(sec) || isNaN(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + String(s).padStart(2, '0');
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function showToast(msg, warn = false) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (warn ? ' warn' : '');

      showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2800);

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function extractCoverArt(blob) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const buf = new Uint8Array(reader.result);
            // ID3v2
            if (buf.length < 10 || buf[0] !== 0x49 || buf[1] !== 0x44 || buf[2] !== 0x33) {
              resolve(null);
              return;
            }
            const ver = buf[3];
            const size = ((buf[6] & 0x7f) << 21) | ((buf[7] & 0x7f) << 14) | ((buf[8] & 0x7f) << 7) | (buf[9] & 0x7f);
            let offset = 10;
            // skip extended header if present
            if (buf[5] & 0x40) {
              if (ver === 4) {
                const es = ((buf[offset] & 0x7f) << 21) | ((buf[offset+1] & 0x7f) << 14) | ((buf[offset+2] & 0x7f) << 7) | (buf[offset+3] & 0x7f);
                offset += es;
              } else {
                const es = (buf[offset] << 24) | (buf[offset+1] << 16) | (buf[offset+2] << 8) | buf[offset+3];
                offset += es;
              }
            }
            const end = Math.min(10 + size, buf.length);
            while (offset + 10 < end) {
              const id = String.fromCharCode(buf[offset], buf[offset+1], buf[offset+2], buf[offset+3]);
              let frameSize;
              if (ver === 4) {
                frameSize = ((buf[offset+4] & 0x7f) << 21) | ((buf[offset+5] & 0x7f) << 14) | ((buf[offset+6] & 0x7f) << 7) | (buf[offset+7] & 0x7f);
              } else {
                frameSize = (buf[offset+4] << 24) | (buf[offset+5] << 16) | (buf[offset+6] << 8) | buf[offset+7];
              }
              if (frameSize <= 0 || offset + 10 + frameSize > buf.length) break;
              if (id === 'APIC' || id === 'PIC') {
                let p = offset + 10;
                const frameEnd = p + frameSize;
                // text encoding
                const encoding = buf[p++];
                let mime = '';
                if (id === 'APIC') {
                  while (p < frameEnd && buf[p] !== 0) { mime += String.fromCharCode(buf[p++]); }
                  p++; // null
                } else {
                  // ID3v2.2 PIC: 3 char image format
                  mime = 'image/' + String.fromCharCode(buf[p], buf[p+1], buf[p+2]).toLowerCase();
                  p += 3;
                }
                if (!mime || mime === 'image/') mime = 'image/jpeg';
                // picture type
                p++;
                // description (null-terminated, encoding dependent)
                if (encoding === 0 || encoding === 3) {
                  while (p < frameEnd && buf[p] !== 0) p++;
                  p++;
                } else {
                  // UTF-16
                  while (p + 1 < frameEnd && !(buf[p] === 0 && buf[p+1] === 0)) p += 2;
                  p += 2;
                }
                if (p >= frameEnd) { resolve(null); return; }
                const imgBytes = buf.slice(p, frameEnd);
                const coverBlob = new Blob([imgBytes], { type: mime.startsWith('image/') ? mime : 'image/jpeg' });
                resolve(coverBlob);
                return;
              }
              offset += 10 + frameSize;
            }
            resolve(null);
          } catch (e) {
            resolve(null);
          }
        };
        reader.onerror = () => resolve(null);
        // only read first ~2MB for tags
        const slice = blob.slice(0, Math.min(blob.size, 2 * 1024 * 1024));
        reader.readAsArrayBuffer(slice);
      });
    }

    function getDurationFromBlob(blob) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(blob);
        const a = new Audio();
        a.preload = 'metadata';
        a.onloadedmetadata = () => {
          const d = a.duration;
          URL.revokeObjectURL(url);
          resolve(isFinite(d) ? d : 0);
        };
        a.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(0);
        };
        a.src = url;
      });
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_BLOBS)) {
            database.createObjectStore(STORE_BLOBS, { keyPath: 'id' });
          }
          if (!database.objectStoreNames.contains(STORE_META)) {
            database.createObjectStore(STORE_META, { keyPath: 'key' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbPut(storeName, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(value);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function idbGet(storeName, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbDelete(storeName, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function saveMeta() {
      await idbPut(STORE_META, { key: META_KEY, tracks });
      await idbPut(STORE_META, { key: MODE_KEY, value: mode });
      await idbPut(STORE_META, { key: SORT_KEY, value: sortMode });
      updateStorageInfo();
    }

    async function loadMeta() {
      const meta = await idbGet(STORE_META, META_KEY);
      if (meta && Array.isArray(meta.tracks)) tracks = meta.tracks;
      const m = await idbGet(STORE_META, MODE_KEY);
      if (m && (m.value === 'shuffle' || m.value === 'sequential')) mode = m.value;
      const s = await idbGet(STORE_META, SORT_KEY);
      if (s && ['manual', 'name', 'duration', 'added'].includes(s.value)) sortMode = s.value;
    }

    async function saveBlob(id, blob) {
      await idbPut(STORE_BLOBS, { id, blob });
    }

    async function getBlob(id) {
      const row = await idbGet(STORE_BLOBS, id);
      return row ? row.blob : null;
    }

    async function deleteBlob(id) {
      await idbDelete(STORE_BLOBS, id);
      if (objectUrls.has(id)) {
        URL.revokeObjectURL(objectUrls.get(id));
        objectUrls.delete(id);
      }
      if (coverUrls.has(id)) {
        URL.revokeObjectURL(coverUrls.get(id));
        coverUrls.delete(id);
      }
    }

    async function getCoverUrl(id) {
      if (coverUrls.has(id)) return coverUrls.get(id);
      const row = await idbGet(STORE_BLOBS, 'cover_' + id);
      if (!row || !row.blob) return null;
      const url = URL.createObjectURL(row.blob);
      coverUrls.set(id, url);
      return url;
    }

    async function getObjectUrl(id) {
      if (objectUrls.has(id)) return objectUrls.get(id);
      const blob = await getBlob(id);
      if (!blob) return null;
      const url = URL.createObjectURL(blob);
      objectUrls.set(id, url);
      return url;
    }

    async function updateStorageInfo() {
      try {
        if (navigator.storage && navigator.storage.estimate) {
          const est = await navigator.storage.estimate();
          const used = est.usage || 0;
          const quota = est.quota || 0;
          storageInfo.textContent = 'Armazenamento: ' + formatSize(used) + ' usados' +
            (quota ? ' · ' + formatSize(quota) + ' disponíveis' : '');
        } else {
          storageInfo.textContent = 'Armazenamento: IndexedDB · ' + tracks.length + ' arquivo(s)';
        }
      } catch {
        storageInfo.textContent = 'Armazenamento: IndexedDB · ' + tracks.length + ' arquivo(s)';
      }
    }

    function renderPlaylist() {
      playlistEl.innerHTML = '';

      if (!tracks.length) {
        playlistEl.innerHTML =
          '<li class="playlist-empty">' + ICONS.empty +
          '<p>Nenhuma música na playlist.<br>Clique em <strong>Adicionar</strong> para incluir arquivos.</p></li>';
        trackCountEl.textContent = '0';
        return;
      }

      tracks.forEach((t, i) => {
        const li = document.createElement('li');
        li.className = 'track' + (i === currentIndex ? ' playing' : '');
        li.draggable = sortMode === 'manual' && !deleteMode;
        li.dataset.index = i;

        li.innerHTML =
          '<span class="t-handle" title="Arraste para reordenar">' + ICONS.grip + '</span>' +
          '<div class="t-cover" data-cover="' + t.id + '">' + ICONS.music + '</div>' +
          '<div class="t-info">' +
            '<div class="t-name" title="' + escapeHtml(t.name) + '"><span class="marquee-inner" data-text="' + escapeHtml(t.name) + '">' + escapeHtml(t.name) + '</span></div>' +
            '<div class="t-meta">' + (t.duration ? formatTime(t.duration) : '—') + ' · #' + (i + 1) + '</div>' +
          '</div>' +
          '<span class="t-duration">' + (t.duration ? formatTime(t.duration) : '—') + '</span>' +
          '<button class="t-remove" title="Apagar" aria-label="Apagar" data-remove="' + i + '">' + ICONS.close + '</button>';

        // load cover async
        (async (elId, coverEl) => {
          const url = await getCoverUrl(elId);
          if (url && coverEl.isConnected) {
            coverEl.innerHTML = '<img src="' + url + '" alt="" />';
          }
        })(t.id, li.querySelector('[data-cover]'));

        // Marquee for long names
        const nameEl = li.querySelector('.t-name');
        const inner = nameEl && nameEl.querySelector('.marquee-inner');
        if (nameEl && inner) {
          // Force layout then check overflow
          requestAnimationFrame(() => {
            if (!nameEl.isConnected) return;
            const needs = inner.scrollWidth > nameEl.clientWidth + 2;
            if (needs) {
              nameEl.classList.add('marquee');
              // Duration based on text length (px ~ speed)
              const extra = inner.scrollWidth - nameEl.clientWidth;
              const dur = Math.max(6, Math.min(22, 4 + extra / 28));
              nameEl.style.setProperty('--marquee-duration', dur + 's');
            }
          });
        }

        li.addEventListener('click', (e) => {
          if (e.target.closest('[data-remove]')) return;
          if (deleteMode) { requestDelete(i); return; }
          playTrack(i);
        });

        if (sortMode === 'manual' && !deleteMode) {
          li.addEventListener('dragstart', onDragStart);
          li.addEventListener('dragover', onDragOver);
          li.addEventListener('dragleave', onDragLeave);
          li.addEventListener('drop', onDrop);
          li.addEventListener('dragend', onDragEnd);
        }

        playlistEl.appendChild(li);
      });

      trackCountEl.textContent = tracks.length === 1 ? '1 música' : tracks.length + ' músicas';
    }

    let dragFrom = null;

    function onDragStart(e) {
      if (sortMode !== 'manual') { e.preventDefault(); return; }
      dragFrom = +e.currentTarget.dataset.index;
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const li = e.currentTarget;
      if (+li.dataset.index !== dragFrom) li.classList.add('drag-over');
    }

    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function onDrop(e) {
      e.preventDefault();
      const to = +e.currentTarget.dataset.index;
      e.currentTarget.classList.remove('drag-over');
      if (dragFrom === null || dragFrom === to) return;

      const item = tracks.splice(dragFrom, 1)[0];
      tracks.splice(to, 0, item);

      if (currentIndex === dragFrom) currentIndex = to;
      else if (dragFrom < currentIndex && to >= currentIndex) currentIndex--;
      else if (dragFrom > currentIndex && to <= currentIndex) currentIndex++;

      if (mode === 'shuffle') buildShuffleOrder(false);
      renderPlaylist();
      saveMeta();
      dragFrom = null;
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      dragFrom = null;
    }

    function applySort(newMode, save = true) {
      const playingId = currentIndex >= 0 ? tracks[currentIndex]?.id : null;
      sortMode = newMode;

      document.querySelectorAll('.sort-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.sort === sortMode);
      });

      if (sortMode === 'name') {
        tracks.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));
      } else if (sortMode === 'duration') {
        tracks.sort((a, b) => (a.duration || 0) - (b.duration || 0));
      } else if (sortMode === 'added') {
        tracks.sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));
      }

      if (playingId) {
        const idx = tracks.findIndex(t => t.id === playingId);
        currentIndex = idx >= 0 ? idx : -1;
      }

      if (mode === 'shuffle') buildShuffleOrder(false);
      renderPlaylist();
      if (save) saveMeta();
    }

    function setPlayIcon(playing) {
      iconPlay.style.display = playing ? 'none' : 'block';
      iconPause.style.display = playing ? 'block' : 'none';
      artwork.classList.toggle('playing', playing);
    }

    async function playTrack(index) {
      if (index < 0 || index >= tracks.length) return;
      currentIndex = index;
      const t = tracks[index];
      const url = await getObjectUrl(t.id);
      if (!url) {
        showToast('Arquivo não encontrado no armazenamento.', true);
        return;
      }
      audio.src = url;
      try {
        await audio.play();
        isPlaying = true;
        setPlayIcon(true);
      } catch {
        showToast('Erro ao reproduzir este arquivo.', true);
      }
      nowTitle.textContent = t.name;
      nowTitle.classList.remove('empty');
      const artImg = document.getElementById('artworkImg');
      const artPh = document.getElementById('artworkPlaceholder');
      const coverUrl = await getCoverUrl(t.id);
      if (coverUrl) {
        artImg.src = coverUrl;
        artImg.style.display = 'block';
        if (artPh) artPh.style.display = 'none';
      } else {
        artImg.style.display = 'none';
        artImg.removeAttribute('src');
        if (artPh) artPh.style.display = 'block';
      }
      renderPlaylist();
    }

    function togglePlay() {
      if (!tracks.length) {
        showToast('Adicione músicas primeiro');
        return;
      }
      if (currentIndex < 0) {
        if (mode === 'shuffle') {
          buildShuffleOrder(true);
          playTrack(shuffleOrder[0]);
        } else {
          playTrack(0);
        }
        return;
      }
      if (audio.paused) {
        audio.play().then(() => {
          isPlaying = true;
          setPlayIcon(true);
        }).catch(() => {
          showToast('Erro ao reproduzir.', true);
        });
      } else {
        audio.pause();
        isPlaying = false;
        setPlayIcon(false);
      }
    }

    function nextTrack() {
      if (!tracks.length) return;
      if (mode === 'shuffle') {
        if (!shuffleOrder.length) buildShuffleOrder(true);
        shufflePos = (shufflePos + 1) % shuffleOrder.length;
        if (shufflePos === 0) buildShuffleOrder(true);
        playTrack(shuffleOrder[shufflePos]);
      } else {
        playTrack((currentIndex + 1) % tracks.length);
      }
    }

    function prevTrack() {
      if (!tracks.length) return;
      if (audio.currentTime > 5) {
        audio.currentTime = 0;
        return;
      }
      if (mode === 'shuffle') {
        if (!shuffleOrder.length) buildShuffleOrder(true);
        shufflePos = (shufflePos - 1 + shuffleOrder.length) % shuffleOrder.length;
        playTrack(shuffleOrder[shufflePos]);
      } else {
        playTrack((currentIndex - 1 + tracks.length) % tracks.length);
      }
    }

    function buildShuffleOrder(resetPos) {
      shuffleOrder = tracks.map((_, i) => i);
      for (let i = shuffleOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
      }
      if (currentIndex >= 0 && shuffleOrder.length > 1 && shuffleOrder[0] === currentIndex) {
        [shuffleOrder[0], shuffleOrder[1]] = [shuffleOrder[1], shuffleOrder[0]];
      }
      if (resetPos) {
        shufflePos = 0;
        if (currentIndex >= 0) {
          const idx = shuffleOrder.indexOf(currentIndex);
          if (idx >= 0) shufflePos = idx;
        }
      }
    }

    function setMode(m) {
      mode = m;
      modeSeq.classList.toggle('active', mode === 'sequential');
      modeShuffle.classList.toggle('active', mode === 'shuffle');
      if (mode === 'shuffle') buildShuffleOrder(true);
      saveMeta();
    }

    async function addFiles(fileList) {
      const files = Array.from(fileList).filter(f =>
        f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|webm)$/i.test(f.name)
      );
      if (!files.length) {
        showToast('Nenhum arquivo de áudio válido.', true);
        return;
      }

      showToast('Carregando ' + files.length + ' arquivo(s)...');
      let added = 0;

      for (const file of files) {
        try {
          const id = uid();
          const duration = await getDurationFromBlob(file);
          const cover = await extractCoverArt(file);
          await saveBlob(id, file);
          if (cover) {
            await idbPut(STORE_BLOBS, { id: 'cover_' + id, blob: cover });
          }
          tracks.push({
            id,
            name: file.name,
            duration,
            addedAt: Date.now(),
            size: file.size,
            hasCover: !!cover
          });
          added++;
        } catch (e) {
          console.error(e);
          showToast('Erro ao salvar: ' + file.name, true);
        }
      }

      if (sortMode !== 'manual') applySort(sortMode, false);
      else renderPlaylist();
      await saveMeta();
      if (added) showToast(added + ' música(s) adicionada(s)');
    }

    btnPlay.addEventListener('click', togglePlay);
    btnNext.addEventListener('click', nextTrack);
    btnPrev.addEventListener('click', prevTrack);

    volumeEl.addEventListener('input', () => { audio.volume = +volumeEl.value; });
    audio.volume = +volumeEl.value;

    modeSeq.addEventListener('click', () => setMode('sequential'));
    modeShuffle.addEventListener('click', () => setMode('shuffle'));

    document.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => applySort(btn.dataset.sort));
    });

    btnAdd.addEventListener('click', () => fileInput.click());
    btnDelete.addEventListener('click', () => {
      if (!tracks.length) { showToast('Não há músicas para apagar'); return; }
      setDeleteMode(!deleteMode);
    });

    btnClearAll.addEventListener('click', async () => {
      if (!tracks.length) { showToast('A playlist já está vazia'); return; }
      setDeleteMode(false);
      const n = tracks.length;
      const ok = await askConfirm(
        'Quer apagar todas as músicas?',
        n === 1 ? '1 música será removida. Essa ação não pode ser desfeita.'
                : n + ' músicas serão removidas. Essa ação não pode ser desfeita.'
      );
      if (!ok) return;
      for (const t of tracks) {
        await deleteBlob(t.id);
        await idbDelete(STORE_BLOBS, 'cover_' + t.id);
      }
      tracks = [];
      currentIndex = -1;
      shuffleOrder = [];
      shufflePos = -1;
      audio.removeAttribute('src');
      audio.load();
      isPlaying = false;
      setPlayIcon(false);
      nowTitle.textContent = 'Nenhuma música selecionada';
      nowTitle.classList.add('empty');
      const artImg = document.getElementById('artworkImg');
      const artPh = document.getElementById('artworkPlaceholder');
      if (artImg) { artImg.style.display = 'none'; artImg.removeAttribute('src'); }
      if (artPh) artPh.style.display = 'block';
      progressFill.style.width = '0%';
      currentTimeEl.textContent = '0:00';
      durationEl.textContent = '0:00';
      renderPlaylist();
      await saveMeta();
      showToast('Playlist limpa');
    });

    function setDeleteMode(on) {
      deleteMode = !!on;
      deleteBanner.hidden = !deleteMode;
      playlistWrap.classList.toggle('delete-mode', deleteMode);
      btnDelete.classList.toggle('active', deleteMode);
      btnDeleteLabel.textContent = deleteMode ? 'Cancelar' : 'Apagar';
      renderPlaylist();
    }

    async function requestDelete(idx) {
      const t = tracks[idx];
      if (!t) return;
      const ok = await askConfirm('Quer apagar a música "' + t.name + '"?', 'Essa ação não pode ser desfeita.');
      if (!ok) return;
      await removeTrack(idx);
      if (!tracks.length) setDeleteMode(false);
    }

    async function removeTrack(idx) {
      const wasPlaying = idx === currentIndex;
      const removed = tracks.splice(idx, 1)[0];
      if (!removed) return;
      await deleteBlob(removed.id);
      await idbDelete(STORE_BLOBS, 'cover_' + removed.id);

      if (!tracks.length) {
        currentIndex = -1;
        audio.removeAttribute('src');
        audio.load();
        isPlaying = false;
        setPlayIcon(false);
        nowTitle.textContent = 'Nenhuma música selecionada';
        nowTitle.classList.add('empty');
        const artImg = document.getElementById('artworkImg');
        const artPh = document.getElementById('artworkPlaceholder');
        if (artImg) { artImg.style.display = 'none'; artImg.removeAttribute('src'); }
        if (artPh) artPh.style.display = 'block';
        progressFill.style.width = '0%';
        currentTimeEl.textContent = '0:00';
        durationEl.textContent = '0:00';
      } else if (wasPlaying) {
        currentIndex = Math.min(idx, tracks.length - 1);
        playTrack(currentIndex);
      } else if (idx < currentIndex) {
        currentIndex--;
      }

      if (mode === 'shuffle') buildShuffleOrder(false);
      renderPlaylist();
      await saveMeta();
      showToast('Música apagada');
    }

    playlistEl.addEventListener('click', (e) => {
      const rm = e.target.closest('[data-remove]');
      if (rm) { requestDelete(+rm.dataset.remove); return; }
    });

    /* ---------- Modal de confirmação ---------- */
    const confirmModal = document.getElementById('confirmModal');
    const confirmTitle = document.getElementById('confirmTitle');
    const confirmText = document.getElementById('confirmText');
    const confirmOk = document.getElementById('confirmOk');
    const confirmCancel = document.getElementById('confirmCancel');
    let confirmResolve = null;

    function askConfirm(title, text) {
      return new Promise((resolve) => {
        if (confirmResolve) confirmResolve(false);
        confirmResolve = resolve;
        confirmTitle.textContent = title;
        confirmText.textContent = text || '';
        confirmModal.hidden = false;
        confirmCancel.focus();
      });
    }
    function closeConfirm(result) {
      confirmModal.hidden = true;
      const r = confirmResolve;
      confirmResolve = null;
      if (r) r(result);
    }
    confirmOk.addEventListener('click', () => closeConfirm(true));
    confirmCancel.addEventListener('click', () => closeConfirm(false));
    confirmModal.addEventListener('click', (e) => { if (e.target === confirmModal) closeConfirm(false); });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      progressFill.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      nextTrack();
    });

    audio.addEventListener('play', () => { isPlaying = true; setPlayIcon(true); });
    audio.addEventListener('pause', () => { isPlaying = false; setPlayIcon(false); });

    progressBar.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressBar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) addFiles(fileInput.files);
      fileInput.value = '';
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!confirmModal.hidden) { closeConfirm(false); return; }
        if (deleteMode) { setDeleteMode(false); return; }
      }
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (!confirmModal.hidden) return;
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      else if (e.code === 'ArrowRight') nextTrack();
      else if (e.code === 'ArrowLeft') prevTrack();
    });

    function makeIconDataURL(srcDataURL, size) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = c.height = size;
          const g = c.getContext('2d');
          // Already rounded source; just scale
          g.drawImage(img, 0, 0, size, size);
          resolve(c.toDataURL('image/png'));
        };
        img.onerror = () => resolve(srcDataURL);
        img.src = srcDataURL;
      });
    }

    async function setupPWA() {
      try {
        const i32 = ICON_DATA.s32;
        const i180 = ICON_DATA.s180;
        const i192 = ICON_DATA.s192;
        // Generate 512 from 192 for PWA
        const i512 = await makeIconDataURL(i192, 512);

        // Link tags for all favicon alternatives
        const head = document.head;
        const addLink = (rel, href, sizes, type) => {
          const l = document.createElement('link');
          l.rel = rel;
          if (sizes) l.sizes = sizes;
          if (type) l.type = type;
          l.href = href;
          head.appendChild(l);
        };
        addLink('icon', i32, '32x32', 'image/png');
        addLink('icon', i192, '192x192', 'image/png');
        addLink('apple-touch-icon', i180, '180x180');
        addLink('apple-touch-icon', i192, '192x192');
        // Shortcut icon (legacy)
        const fav = document.createElement('link');
        fav.rel = 'shortcut icon';
        fav.type = 'image/png';
        fav.href = i32;
        head.appendChild(fav);

        // Brand icon in the UI
        const brandEl = document.getElementById('brandIcon');
        if (brandEl) {
          brandEl.innerHTML = '<img src="' + i192 + '" alt="Music Player" />';
        }

        const base = location.href.split('#')[0].split('?')[0];
        const scope = base.replace(/[^/]*$/, '');
        const manifest = {
          id: base,
          name: 'Music Player',
          short_name: 'Music Player',
          description: 'Player de músicas local e offline',
          lang: 'pt-BR',
          start_url: base,
          scope: scope,
          display: 'standalone',
          orientation: 'any',
          background_color: '#0a0a0c',
          theme_color: '#0a0a0c',
          icons: [
            { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
            { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' },
            { src: i192, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
            { src: i512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
          ]
        };
        const mUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = mUrl;
        head.appendChild(link);
      } catch (e) { console.warn('PWA manifest:', e); }
    }
    setupPWA();

    /* ---------- Efeito ripple (Material) ---------- */
    document.addEventListener('pointerdown', (e) => {
      const el = e.target.closest('.btn, .m-btn, .ctrl, .icon-btn, .mode-btn, .sort-btn, .t-remove');
      if (!el || el.disabled) return;
      const r = el.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const sp = document.createElement('span');
      sp.className = 'ripple-span';
      sp.style.width = sp.style.height = size + 'px';
      sp.style.left = (e.clientX - r.left - size / 2) + 'px';
      sp.style.top = (e.clientY - r.top - size / 2) + 'px';
      el.appendChild(sp);
      setTimeout(() => sp.remove(), 600);
    });

    (async () => {
      try {
        db = await openDB();
        await loadMeta();
        modeSeq.classList.toggle('active', mode === 'sequential');
        modeShuffle.classList.toggle('active', mode === 'shuffle');
        document.querySelectorAll('.sort-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.sort === sortMode);
        });
        renderPlaylist();
        updateStorageInfo();
        if (tracks.length) showToast(tracks.length + ' música(s) carregada(s)');
      } catch (e) {
        console.error(e);
        showToast('Erro ao abrir armazenamento local.', true);
        renderPlaylist();
      }
    })();
  </script>
</body>
</html>
