<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f0c;
      --bg-elevated: #0f1612;
      --surface: #141c17;
      --surface-hover: #1a2420;
      --surface-2: #1c2822;
      --border: #24302a;
      --border-subtle: #1a2420;
      --text: #e8f0eb;
      --text-secondary: #a3b5ab;
      --text-muted: #6b7f74;
      --accent: #00e676;
      --accent-hover: #00c853;
      --accent-dark: #00a844;
      --accent-muted: rgba(0, 230, 118, 0.15);
      --accent-border: rgba(0, 230, 118, 0.45);
      --accent-glow: rgba(0, 230, 118, 0.35);
      --danger: #ef5350;
      --danger-muted: rgba(239, 83, 80, 0.12);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-xs: 8px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      --font: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0, 230, 118, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(0, 168, 68, 0.08), transparent);
    }

    .shell {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (min-width: 860px) {
      .shell {
        grid-template-columns: 340px 1fr;
        grid-template-rows: 1fr;
        height: 100vh;
        max-height: 100vh;
      }
    }

    .player-panel {
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      box-shadow: var(--shadow-sm);
    }

    @media (min-width: 860px) {
      .player-panel {
        border-bottom: none;
        border-right: 1px solid var(--border);
        overflow-y: auto;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
      fill: #0a0f0c;
    }

    .brand h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand span {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-top: 2px;
    }

    .now-playing {
      text-align: center;
      padding: 8px 0 4px;
    }

    .artwork {
      width: 168px;
      height: 168px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(145deg, #1a2820 0%, #0f1612 100%);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .artwork svg {
      width: 52px;
      height: 52px;
      fill: var(--text-muted);
      opacity: 0.45;
    }

    .artwork.playing::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 230, 118, 0.22) 0%, transparent 70%);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .track-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .track-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
      max-width: 100%;
      padding: 0 4px;
    }

    .track-title.empty {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 0.9rem;
    }

    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-track {
      height: 6px;
      background: var(--surface);
      border-radius: 99px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-dark), var(--accent));
      border-radius: 99px;
      pointer-events: none;
      transition: width 0.1s linear;
    }

    .progress-track:hover .progress-fill {
      background: var(--accent);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .ctrl {
      width: 44px;
      height: 44px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s, transform 0.1s, box-shadow 0.15s;
    }

    .ctrl:hover {
      color: var(--text);
      background: var(--surface);
    }

    .ctrl:active { transform: scale(0.92); }

    .ctrl svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .ctrl-play {
      width: 56px;
      height: 56px;
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: #0a0f0c;
      box-shadow: 0 4px 18px var(--accent-glow);
    }

    .ctrl-play:hover {
      background: linear-gradient(145deg, var(--accent-hover), var(--accent));
      color: #0a0f0c;
      box-shadow: 0 6px 22px var(--accent-glow);
    }

    .ctrl-play svg {
      width: 24px;
      height: 24px;
    }

    .secondary-controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 2px;
    }

    .volume-row svg {
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      flex-shrink: 0;
    }

    .volume-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      background: var(--surface);
      border-radius: 99px;
      outline: none;
    }

    .volume-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .volume-row input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }

    .mode-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--surface);
      padding: 5px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }

    .mode-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 500;
      font-family: inherit;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #0a0f0c;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .mode-btn:hover:not(.active) {
      color: var(--text-secondary);
      background: var(--surface-hover);
    }

    .main-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--bg);
    }

    .main-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-shrink: 0;
    }

    .main-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .main-header h2 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .track-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
    }

    .btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .btn:hover {
      border-color: var(--text-muted);
      color: var(--text);
      background: var(--surface-hover);
    }

    .btn-accent {
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      border-color: transparent;
      color: #0a0f0c;
      box-shadow: 0 3px 12px var(--accent-glow);
    }

    .btn-accent:hover {
      background: linear-gradient(145deg, var(--accent-hover), var(--accent));
      border-color: transparent;
      color: #0a0f0c;
    }

    .btn-danger:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: var(--danger-muted);
    }

    .sort-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sort-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    .sort-btn {
      padding: 6px 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      font-family: inherit;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .sort-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .sort-btn:hover {
      color: var(--text-secondary);
      background: var(--surface);
    }

    .sort-btn.active {
      color: var(--accent);
      background: var(--accent-muted);
      border-color: var(--accent-border);
    }

    .playlist-wrap {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding: 8px 12px 16px;
    }

    .playlist { list-style: none; }

    .playlist-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 48px 24px;
      color: var(--text-muted);
      text-align: center;
    }

    .playlist-empty svg {
      width: 44px;
      height: 44px;
      fill: var(--text-muted);
      opacity: 0.4;
    }

    .playlist-empty p { font-size: 0.9rem; }

    .track {
      display: grid;
      grid-template-columns: 28px 44px 1fr auto 36px;
      align-items: center;
      gap: 4px 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
      user-select: none;
      border: 1px solid var(--border);
      margin-bottom: 6px;
      background: var(--surface);
    }

    .track:hover {
      background: var(--surface-hover);
      border-color: rgba(0, 230, 118, 0.35);
    }

    .track.playing {
      background: var(--accent-muted);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-border), inset 3px 0 0 var(--accent);
    }

    .t-cover {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
      background: linear-gradient(145deg, #1a2820, #0f1612);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .t-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .t-cover svg {
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      opacity: 0.5;
    }

    .artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: inherit;
    }

    .track.playing .t-name {
      color: var(--accent);
      font-weight: 600;
    }

    .track.dragging { opacity: 0.4; }

    .track.drag-over {
      box-shadow: inset 0 2px 0 0 var(--accent);
    }

    .t-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: grab;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .track:hover .t-handle { opacity: 1; }

    .t-handle svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .t-num {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .track.playing .t-num { color: var(--accent); }

    .t-info {
      min-width: 0;
      overflow: hidden;
    }

    .t-name {
      font-size: 0.875rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .t-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .t-duration {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 36px;
      text-align: right;
      font-weight: 500;
    }

    .t-remove {
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.15s;
    }

    .track:hover .t-remove { opacity: 1; }

    .t-remove:hover {
      background: var(--danger-muted);
      color: var(--danger);
    }

    .t-remove svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    input[type="file"] { display: none; }

    .storage-status {
      font-size: 0.7rem;
      color: var(--text-muted);
      padding: 0 16px 12px;
      text-align: right;
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.875rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      max-width: 90vw;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.warn {
      border-color: #f59e0b;
      color: #fbbf24;
    }

    .playlist-wrap::-webkit-scrollbar,
    .player-panel::-webkit-scrollbar {
      width: 6px;
    }
    .playlist-wrap::-webkit-scrollbar-thumb,
    .player-panel::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 99px;
    }
    .playlist-wrap::-webkit-scrollbar-thumb:hover,
    .player-panel::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    @media (max-width: 859px) {
      .artwork {
        width: 128px;
        height: 128px;
      }
      .track {
        grid-template-columns: 24px 40px 1fr auto 32px;
      }
      .t-meta { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="player-panel">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <div>
          <h1>Music Player</h1>
          <span>Local · Offline</span>
        </div>
      </div>

      <div class="now-playing">
        <div class="artwork" id="artwork">
          <svg viewBox="0 0 24 24" id="artworkPlaceholder"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <img id="artworkImg" alt="" style="display:none" />
        </div>
        <div class="track-label">Tocando agora</div>
        <div class="track-title empty" id="nowTitle">Nenhuma música selecionada</div>
      </div>

      <div class="progress-section">
        <div class="progress-track" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" id="btnPrev" title="Anterior">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl ctrl-play" id="btnPlay" title="Play / Pause">
          <svg viewBox="0 0 24 24" id="iconPlay"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" id="iconPause" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl" id="btnNext" title="Próxima">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <div class="secondary-controls">
        <div class="volume-row">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.85" />
        </div>

        <div class="mode-group">
          <button class="mode-btn active" data-mode="sequential" id="modeSeq">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
            Sequência
          </button>
          <button class="mode-btn" data-mode="shuffle" id="modeShuffle">
            <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            Aleatório
          </button>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <div class="main-header">
        <div class="main-header-top">
          <h2>Playlist <span class="track-count" id="trackCount">0</span></h2>
          <div class="header-actions">
            <button class="btn btn-accent" id="btnAdd">
              <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
              Adicionar
            </button>
            <button class="btn btn-danger" id="btnClear" title="Limpar playlist">
              <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              Limpar
            </button>
          </div>
        </div>

        <div class="sort-bar">
          <span class="sort-label">Ordenar</span>
          <button class="sort-btn active" data-sort="manual" id="sortManual">
            <svg viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg>
            Manual
          </button>
          <button class="sort-btn" data-sort="name" id="sortName">
            <svg viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg>
            A–Z
          </button>
          <button class="sort-btn" data-sort="duration" id="sortDuration">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            Duração
          </button>
          <button class="sort-btn" data-sort="added" id="sortAdded">
            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>
            Data
          </button>
        </div>
      </div>

      <div class="playlist-wrap">
        <ul class="playlist" id="playlist"></ul>
      </div>

      <p class="storage-status" id="storageInfo">Armazenamento: IndexedDB</p>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <audio id="audio" preload="metadata"></audio>
  <input type="file" id="fileInput" accept="audio/*" multiple />

  <script>
    const ICONS = {
      music: '<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>',
      grip: '<svg viewBox="0 0 24 24"><path d="M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>',
      close: '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
      empty: '<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>',
    };

    const DB_NAME = 'MusicPlayerDB';
    const DB_VERSION = 1;
    const STORE_BLOBS = 'blobs';
    const STORE_META = 'meta';
    const META_KEY = 'playlist';
    const MODE_KEY = 'mode';
    const SORT_KEY = 'sort';

    let db = null;
    let tracks = [];
    let currentIndex = -1;
    let mode = 'sequential';
    let sortMode = 'manual';
    let isPlaying = false;
    let shuffleOrder = [];
    let shufflePos = -1;
    let objectUrls = new Map();
    let coverUrls = new Map();

    const audio = document.getElementById('audio');
    const playlistEl = document.getElementById('playlist');
    const nowTitle = document.getElementById('nowTitle');
    const artwork = document.getElementById('artwork');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const btnPlay = document.getElementById('btnPlay');
    const iconPlay = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const volumeEl = document.getElementById('volume');
    const fileInput = document.getElementById('fileInput');
    const trackCountEl = document.getElementById('trackCount');
    const toastEl = document.getElementById('toast');
    const storageInfo = document.getElementById('storageInfo');
    const modeSeq = document.getElementById('modeSeq');
    const modeShuffle = document.getElementById('modeShuffle');
    const btnClear = document.getElementById('btnClear');
    const btnAdd = document.getElementById('btnAdd');

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    }

    function formatTime(sec) {
      if (!isFinite(sec) || isNaN(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + String(s).padStart(2, '0');
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function showToast(msg, warn = false) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (warn ? ' warn' : '');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2800);
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function extractCoverArt(blob) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const buf = new Uint8Array(reader.result);
            // ID3v2
            if (buf.length < 10 || buf[0] !== 0x49 || buf[1] !== 0x44 || buf[2] !== 0x33) {
              resolve(null);
              return;
            }
            const ver = buf[3];
            const size = ((buf[6] & 0x7f) << 21) | ((buf[7] & 0x7f) << 14) | ((buf[8] & 0x7f) << 7) | (buf[9] & 0x7f);
            let offset = 10;
            // skip extended header if present
            if (buf[5] & 0x40) {
              if (ver === 4) {
                const es = ((buf[offset] & 0x7f) << 21) | ((buf[offset+1] & 0x7f) << 14) | ((buf[offset+2] & 0x7f) << 7) | (buf[offset+3] & 0x7f);
                offset += es;
              } else {
                const es = (buf[offset] << 24) | (buf[offset+1] << 16) | (buf[offset+2] << 8) | buf[offset+3];
                offset += es;
              }
            }
            const end = Math.min(10 + size, buf.length);
            while (offset + 10 < end) {
              const id = String.fromCharCode(buf[offset], buf[offset+1], buf[offset+2], buf[offset+3]);
              let frameSize;
              if (ver === 4) {
                frameSize = ((buf[offset+4] & 0x7f) << 21) | ((buf[offset+5] & 0x7f) << 14) | ((buf[offset+6] & 0x7f) << 7) | (buf[offset+7] & 0x7f);
              } else {
                frameSize = (buf[offset+4] << 24) | (buf[offset+5] << 16) | (buf[offset+6] << 8) | buf[offset+7];
              }
              if (frameSize <= 0 || offset + 10 + frameSize > buf.length) break;
              if (id === 'APIC' || id === 'PIC') {
                let p = offset + 10;
                const frameEnd = p + frameSize;
                // text encoding
                const encoding = buf[p++];
                let mime = '';
                if (id === 'APIC') {
                  while (p < frameEnd && buf[p] !== 0) { mime += String.fromCharCode(buf[p++]); }
                  p++; // null
                } else {
                  // ID3v2.2 PIC: 3 char image format
                  mime = 'image/' + String.fromCharCode(buf[p], buf[p+1], buf[p+2]).toLowerCase();
                  p += 3;
                }
                if (!mime || mime === 'image/') mime = 'image/jpeg';
                // picture type
                p++;
                // description (null-terminated, encoding dependent)
                if (encoding === 0 || encoding === 3) {
                  while (p < frameEnd && buf[p] !== 0) p++;
                  p++;
                } else {
                  // UTF-16
                  while (p + 1 < frameEnd && !(buf[p] === 0 && buf[p+1] === 0)) p += 2;
                  p += 2;
                }
                if (p >= frameEnd) { resolve(null); return; }
                const imgBytes = buf.slice(p, frameEnd);
                const coverBlob = new Blob([imgBytes], { type: mime.startsWith('image/') ? mime : 'image/jpeg' });
                resolve(coverBlob);
                return;
              }
              offset += 10 + frameSize;
            }
            resolve(null);
          } catch (e) {
            resolve(null);
          }
        };
        reader.onerror = () => resolve(null);
        // only read first ~2MB for tags
        const slice = blob.slice(0, Math.min(blob.size, 2 * 1024 * 1024));
        reader.readAsArrayBuffer(slice);
      });
    }

    function getDurationFromBlob(blob) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(blob);
        const a = new Audio();
        a.preload = 'metadata';
        a.onloadedmetadata = () => {
          const d = a.duration;
          URL.revokeObjectURL(url);
          resolve(isFinite(d) ? d : 0);
        };
        a.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(0);
        };
        a.src = url;
      });
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_BLOBS)) {
            database.createObjectStore(STORE_BLOBS, { keyPath: 'id' });
          }
          if (!database.objectStoreNames.contains(STORE_META)) {
            database.createObjectStore(STORE_META, { keyPath: 'key' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbPut(storeName, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(value);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function idbGet(storeName, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbDelete(storeName, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function saveMeta() {
      await idbPut(STORE_META, { key: META_KEY, tracks });
      await idbPut(STORE_META, { key: MODE_KEY, value: mode });
      await idbPut(STORE_META, { key: SORT_KEY, value: sortMode });
      updateStorageInfo();
    }

    async function loadMeta() {
      const meta = await idbGet(STORE_META, META_KEY);
      if (meta && Array.isArray(meta.tracks)) tracks = meta.tracks;
      const m = await idbGet(STORE_META, MODE_KEY);
      if (m && (m.value === 'shuffle' || m.value === 'sequential')) mode = m.value;
      const s = await idbGet(STORE_META, SORT_KEY);
      if (s && ['manual', 'name', 'duration', 'added'].includes(s.value)) sortMode = s.value;
    }

    async function saveBlob(id, blob) {
      await idbPut(STORE_BLOBS, { id, blob });
    }

    async function getBlob(id) {
      const row = await idbGet(STORE_BLOBS, id);
      return row ? row.blob : null;
    }

    async function deleteBlob(id) {
      await idbDelete(STORE_BLOBS, id);
      if (objectUrls.has(id)) {
        URL.revokeObjectURL(objectUrls.get(id));
        objectUrls.delete(id);
      }
      if (coverUrls.has(id)) {
        URL.revokeObjectURL(coverUrls.get(id));
        coverUrls.delete(id);
      }
    }

    async function getCoverUrl(id) {
      if (coverUrls.has(id)) return coverUrls.get(id);
      const row = await idbGet(STORE_BLOBS, 'cover_' + id);
      if (!row || !row.blob) return null;
      const url = URL.createObjectURL(row.blob);
      coverUrls.set(id, url);
      return url;
    }

    async function getObjectUrl(id) {
      if (objectUrls.has(id)) return objectUrls.get(id);
      const blob = await getBlob(id);
      if (!blob) return null;
      const url = URL.createObjectURL(blob);
      objectUrls.set(id, url);
      return url;
    }

    async function updateStorageInfo() {
      try {
        if (navigator.storage && navigator.storage.estimate) {
          const est = await navigator.storage.estimate();
          const used = est.usage || 0;
          const quota = est.quota || 0;
          storageInfo.textContent = 'Armazenamento: ' + formatSize(used) + ' usados' +
            (quota ? ' · ' + formatSize(quota) + ' disponíveis' : '');
        } else {
          storageInfo.textContent = 'Armazenamento: IndexedDB · ' + tracks.length + ' arquivo(s)';
        }
      } catch {
        storageInfo.textContent = 'Armazenamento: IndexedDB · ' + tracks.length + ' arquivo(s)';
      }
    }

    function renderPlaylist() {
      playlistEl.innerHTML = '';

      if (!tracks.length) {
        playlistEl.innerHTML =
          '<li class="playlist-empty">' + ICONS.empty +
          '<p>Nenhuma música na playlist.<br>Clique em <strong>Adicionar</strong> para incluir arquivos.</p></li>';
        trackCountEl.textContent = '0';
        return;
      }

      tracks.forEach((t, i) => {
        const li = document.createElement('li');
        li.className = 'track' + (i === currentIndex ? ' playing' : '');
        li.draggable = sortMode === 'manual';
        li.dataset.index = i;

        li.innerHTML =
          '<span class="t-handle" title="Arraste para reordenar">' + ICONS.grip + '</span>' +
          '<div class="t-cover" data-cover="' + t.id + '">' + ICONS.music + '</div>' +
          '<div class="t-info">' +
            '<div class="t-name" title="' + escapeHtml(t.name) + '">' + escapeHtml(t.name) + '</div>' +
            '<div class="t-meta">' + (t.duration ? formatTime(t.duration) : '—') + ' · #' + (i + 1) + '</div>' +
          '</div>' +
          '<span class="t-duration">' + (t.duration ? formatTime(t.duration) : '—') + '</span>' +
          '<button class="t-remove" title="Remover" data-remove="' + i + '">' + ICONS.close + '</button>';

        // load cover async
        (async (elId, coverEl) => {
          const url = await getCoverUrl(elId);
          if (url && coverEl.isConnected) {
            coverEl.innerHTML = '<img src="' + url + '" alt="" />';
          }
        })(t.id, li.querySelector('[data-cover]'));

        li.addEventListener('click', (e) => {
          if (e.target.closest('[data-remove]')) return;
          playTrack(i);
        });

        if (sortMode === 'manual') {
          li.addEventListener('dragstart', onDragStart);
          li.addEventListener('dragover', onDragOver);
          li.addEventListener('dragleave', onDragLeave);
          li.addEventListener('drop', onDrop);
          li.addEventListener('dragend', onDragEnd);
        }

        playlistEl.appendChild(li);
      });

      trackCountEl.textContent = tracks.length === 1 ? '1 música' : tracks.length + ' músicas';
    }

    let dragFrom = null;

    function onDragStart(e) {
      if (sortMode !== 'manual') { e.preventDefault(); return; }
      dragFrom = +e.currentTarget.dataset.index;
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const li = e.currentTarget;
      if (+li.dataset.index !== dragFrom) li.classList.add('drag-over');
    }

    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function onDrop(e) {
      e.preventDefault();
      const to = +e.currentTarget.dataset.index;
      e.currentTarget.classList.remove('drag-over');
      if (dragFrom === null || dragFrom === to) return;

      const item = tracks.splice(dragFrom, 1)[0];
      tracks.splice(to, 0, item);

      if (currentIndex === dragFrom) currentIndex = to;
      else if (dragFrom < currentIndex && to >= currentIndex) currentIndex--;
      else if (dragFrom > currentIndex && to <= currentIndex) currentIndex++;

      if (mode === 'shuffle') buildShuffleOrder(false);
      renderPlaylist();
      saveMeta();
      dragFrom = null;
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      dragFrom = null;
    }

    function applySort(newMode, save = true) {
      const playingId = currentIndex >= 0 ? tracks[currentIndex]?.id : null;
      sortMode = newMode;

      document.querySelectorAll('.sort-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.sort === sortMode);
      });

      if (sortMode === 'name') {
        tracks.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));
      } else if (sortMode === 'duration') {
        tracks.sort((a, b) => (a.duration || 0) - (b.duration || 0));
      } else if (sortMode === 'added') {
        tracks.sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));
      }

      if (playingId) {
        const idx = tracks.findIndex(t => t.id === playingId);
        currentIndex = idx >= 0 ? idx : -1;
      }

      if (mode === 'shuffle') buildShuffleOrder(false);
      renderPlaylist();
      if (save) saveMeta();
    }

    function setPlayIcon(playing) {
      iconPlay.style.display = playing ? 'none' : 'block';
      iconPause.style.display = playing ? 'block' : 'none';
      artwork.classList.toggle('playing', playing);
    }

    async function playTrack(index) {
      if (index < 0 || index >= tracks.length) return;
      currentIndex = index;
      const t = tracks[index];
      const url = await getObjectUrl(t.id);
      if (!url) {
        showToast('Arquivo não encontrado no armazenamento.', true);
        return;
      }
      audio.src = url;
      try {
        await audio.play();
        isPlaying = true;
        setPlayIcon(true);
      } catch {
        showToast('Erro ao reproduzir este arquivo.', true);
      }
      nowTitle.textContent = t.name;
      nowTitle.classList.remove('empty');
      const artImg = document.getElementById('artworkImg');
      const artPh = document.getElementById('artworkPlaceholder');
      const coverUrl = await getCoverUrl(t.id);
      if (coverUrl) {
        artImg.src = coverUrl;
        artImg.style.display = 'block';
        if (artPh) artPh.style.display = 'none';
      } else {
        artImg.style.display = 'none';
        artImg.removeAttribute('src');
        if (artPh) artPh.style.display = 'block';
      }
      renderPlaylist();
    }

    function togglePlay() {
      if (!tracks.length) {
        showToast('Adicione músicas primeiro');
        return;
      }
      if (currentIndex < 0) {
        if (mode === 'shuffle') {
          buildShuffleOrder(true);
          playTrack(shuffleOrder[0]);
        } else {
          playTrack(0);
        }
        return;
      }
      if (audio.paused) {
        audio.play().then(() => {
          isPlaying = true;
          setPlayIcon(true);
        }).catch(() => {
          showToast('Erro ao reproduzir.', true);
        });
      } else {
        audio.pause();
        isPlaying = false;
        setPlayIcon(false);
      }
    }

    function nextTrack() {
      if (!tracks.length) return;
      if (mode === 'shuffle') {
        if (!shuffleOrder.length) buildShuffleOrder(true);
        shufflePos = (shufflePos + 1) % shuffleOrder.length;
        if (shufflePos === 0) buildShuffleOrder(true);
        playTrack(shuffleOrder[shufflePos]);
      } else {
        playTrack((currentIndex + 1) % tracks.length);
      }
    }

    function prevTrack() {
      if (!tracks.length) return;
      if (audio.currentTime > 5) {
        audio.currentTime = 0;
        return;
      }
      if (mode === 'shuffle') {
        if (!shuffleOrder.length) buildShuffleOrder(true);
        shufflePos = (shufflePos - 1 + shuffleOrder.length) % shuffleOrder.length;
        playTrack(shuffleOrder[shufflePos]);
      } else {
        playTrack((currentIndex - 1 + tracks.length) % tracks.length);
      }
    }

    function buildShuffleOrder(resetPos) {
      shuffleOrder = tracks.map((_, i) => i);
      for (let i = shuffleOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
      }
      if (currentIndex >= 0 && shuffleOrder.length > 1 && shuffleOrder[0] === currentIndex) {
        [shuffleOrder[0], shuffleOrder[1]] = [shuffleOrder[1], shuffleOrder[0]];
      }
      if (resetPos) {
        shufflePos = 0;
        if (currentIndex >= 0) {
          const idx = shuffleOrder.indexOf(currentIndex);
          if (idx >= 0) shufflePos = idx;
        }
      }
    }

    function setMode(m) {
      mode = m;
      modeSeq.classList.toggle('active', mode === 'sequential');
      modeShuffle.classList.toggle('active', mode === 'shuffle');
      if (mode === 'shuffle') buildShuffleOrder(true);
      saveMeta();
    }

    async function addFiles(fileList) {
      const files = Array.from(fileList).filter(f =>
        f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|webm)$/i.test(f.name)
      );
      if (!files.length) {
        showToast('Nenhum arquivo de áudio válido.', true);
        return;
      }

      showToast('Carregando ' + files.length + ' arquivo(s)...');
      let added = 0;

      for (const file of files) {
        try {
          const id = uid();
          const duration = await getDurationFromBlob(file);
          const cover = await extractCoverArt(file);
          await saveBlob(id, file);
          if (cover) {
            await idbPut(STORE_BLOBS, { id: 'cover_' + id, blob: cover });
          }
          tracks.push({
            id,
            name: file.name,
            duration,
            addedAt: Date.now(),
            size: file.size,
            hasCover: !!cover
          });
          added++;
        } catch (e) {
          console.error(e);
          showToast('Erro ao salvar: ' + file.name, true);
        }
      }

      if (sortMode !== 'manual') applySort(sortMode, false);
      else renderPlaylist();
      await saveMeta();
      if (added) showToast(added + ' música(s) adicionada(s)');
    }

    btnPlay.addEventListener('click', togglePlay);
    btnNext.addEventListener('click', nextTrack);
    btnPrev.addEventListener('click', prevTrack);

    volumeEl.addEventListener('input', () => { audio.volume = +volumeEl.value; });
    audio.volume = +volumeEl.value;

    modeSeq.addEventListener('click', () => setMode('sequential'));
    modeShuffle.addEventListener('click', () => setMode('shuffle'));

    document.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => applySort(btn.dataset.sort));
    });

    btnAdd.addEventListener('click', () => fileInput.click());
    btnClear.addEventListener('click', async () => {
      if (!tracks.length) return;
      if (!confirm('Remover todas as músicas da playlist?')) return;
      for (const t of tracks) {
        await deleteBlob(t.id);
        await idbDelete(STORE_BLOBS, 'cover_' + t.id);
      }
      tracks = [];
      currentIndex = -1;
      shuffleOrder = [];
      shufflePos = -1;
      audio.src = '';
      isPlaying = false;
      setPlayIcon(false);
      nowTitle.textContent = 'Nenhuma música selecionada';
      nowTitle.classList.add('empty');
      const artImg = document.getElementById('artworkImg');
      const artPh = document.getElementById('artworkPlaceholder');
      if (artImg) { artImg.style.display = 'none'; artImg.removeAttribute('src'); }
      if (artPh) artPh.style.display = 'block';
      progressFill.style.width = '0%';
      currentTimeEl.textContent = '0:00';
      durationEl.textContent = '0:00';
      renderPlaylist();
      await saveMeta();
      showToast('Playlist limpa');
    });

    playlistEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-remove]');
      if (!btn) return;
      const idx = +btn.dataset.remove;
      const wasPlaying = idx === currentIndex;
      const removed = tracks.splice(idx, 1)[0];
      await deleteBlob(removed.id);
      await idbDelete(STORE_BLOBS, 'cover_' + removed.id);

      if (!tracks.length) {
        currentIndex = -1;
        audio.src = '';
        isPlaying = false;
        setPlayIcon(false);
        nowTitle.textContent = 'Nenhuma música selecionada';
        nowTitle.classList.add('empty');
      } else if (wasPlaying) {
        currentIndex = Math.min(idx, tracks.length - 1);
        playTrack(currentIndex);
      } else if (idx < currentIndex) {
        currentIndex--;
      }

      if (mode === 'shuffle') buildShuffleOrder(false);
      renderPlaylist();
      await saveMeta();
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      progressFill.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      nextTrack();
    });

    audio.addEventListener('play', () => { isPlaying = true; setPlayIcon(true); });
    audio.addEventListener('pause', () => { isPlaying = false; setPlayIcon(false); });

    progressBar.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressBar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) addFiles(fileInput.files);
      fileInput.value = '';
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      else if (e.code === 'ArrowRight') nextTrack();
      else if (e.code === 'ArrowLeft') prevTrack();
    });

    (async () => {
      try {
        db = await openDB();
        await loadMeta();
        modeSeq.classList.toggle('active', mode === 'sequential');
        modeShuffle.classList.toggle('active', mode === 'shuffle');
        document.querySelectorAll('.sort-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.sort === sortMode);
        });
        renderPlaylist();
        updateStorageInfo();
        if (tracks.length) showToast(tracks.length + ' música(s) carregada(s)');
      } catch (e) {
        console.error(e);
        showToast('Erro ao abrir armazenamento local.', true);
        renderPlaylist();
      }
    })();
  </script>
</body>
</html>
